# Q6.2 expected Operational Network address masks (BOR release v0.3.0, run 2026-05-29-869bd299, masked_addresses.csv).
# verified against the frozen baseline recorded in data/README.md (2026-11-16). check_masked.py re-derives each from the release and the source.
# degree counts landlord nodes (Who Owns What records) at the address; the mask applies at more than 25.
masked:
