  - {address: "909 THIRD AVENUE", addressId: A0000025, degree: 125, hpdContacts: 566, hpdZips: ["10017", "10022"], note: "the release has no ZIP, so two HPD ZIPs carry the text"}
  - {address: "4205 EIGHTH AVENUE", addressId: A0000012, degree: 30, hpdContacts: 211, hpdZips: ["11204", "11214", "11220", "11232"], note: "four ZIPs: the text names several addresses"}
