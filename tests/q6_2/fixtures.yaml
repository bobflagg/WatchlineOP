totals:
  masked_addresses: 73
  method: network_address_edge_mask
  normalizer_version: c92693351768
  threshold: 25
  degree_unit: "landlords (lwc nodes)"
  degree_min: 26
  degree_max: 216
  masked_with_hpd_contacts: 31   # masked addresses that at least one HPD contact carries (street plus second line)
  masked_edges: 230305           # address edges BOR set aside at the 73 masked addresses (graph_edges, release v0.3.0); cited per address, none loaded as a relationship
  masked_nodes: 4117             # rows of masked_address_nodes.csv
