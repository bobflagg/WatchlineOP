# Same format as tests/negative/q21/cases.yaml: bad data inside a transaction that is always rolled back.
# Cases reuse the existing property key `status` so no new key token is created and the check keeps its catalog fast path.
# The Q22-only keys, relationship types and labels (sameEntity, SAME_AS, EntityMatch, ...) are guarded by the check but not seeded here.
cases:
  - {name: status stored on a contact,       create: "MATCH (n:Contact) WITH n LIMIT 1 SET n.status = 'same'", check: queries/checks/q22-computed-not-stored.cypher}
  - {name: status stored on a grantee,       create: "MATCH (n:Grantee) WITH n LIMIT 1 SET n.status = 'same'", check: queries/checks/q22-computed-not-stored.cypher}
  - {name: status stored on a grantor,       create: "MATCH (n:Grantor) WITH n LIMIT 1 SET n.status = 'same'", check: queries/checks/q22-computed-not-stored.cypher}
  - {name: status stored on a DOS entity,    create: "MATCH (n:DosEntity) WITH n LIMIT 1 SET n.status = 'same'", check: queries/checks/q22-computed-not-stored.cypher}
