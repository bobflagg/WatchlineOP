# Same format as tests/negative/q19/cases.yaml: bad data inside a transaction that is always rolled back.
# Cases reuse the existing property key `status` so no new key token is created and the check keeps its catalog fast path.
# The Q20-only labels and keys (Dossier, Lead, stopReason, leadStatus, ownedBy, ...) are guarded by the check but not seeded here.
cases:
  - {name: status stored on a lot,                  create: "MATCH (n:Lot) WITH n LIMIT 1 SET n.status = 'lead'", check: queries/checks/q20-computed-not-stored.cypher}
  - {name: status stored on a registration,         create: "MATCH (n:Registration) WITH n LIMIT 1 SET n.status = 'followed'", check: queries/checks/q20-computed-not-stored.cypher}
  - {name: status stored on a contact,              create: "MATCH (n:Contact) WITH n LIMIT 1 SET n.status = 'owner'", check: queries/checks/q20-computed-not-stored.cypher}
  - {name: status stored on a deed,                 create: "MATCH (n:Deed) WITH n LIMIT 1 SET n.status = 'finding'", check: queries/checks/q20-computed-not-stored.cypher}
  - {name: status stored on a DOS entity,           create: "MATCH (n:DosEntity) WITH n LIMIT 1 SET n.status = 'stop'", check: queries/checks/q20-computed-not-stored.cypher}
  - {name: status stored on an owner portfolio,     create: "MATCH (n:OwnerPortfolio) WITH n LIMIT 1 SET n.status = 'owned'", check: queries/checks/q20-computed-not-stored.cypher}
