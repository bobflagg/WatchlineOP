# Same format as tests/negative/q04/cases.yaml: bad data inside a transaction that is always rolled back.
cases:
  - {name: DOS id zero, create: "CREATE (:DosEntity {dosId: 0, name: 'ACME LLC', nameKey: 'ACME LLC', entityType: 'DOMESTIC LIMITED LIABILITY COMPANY', filingDate: date('2020-01-01')})", rule: DosEntityShape.dosId.minInclusive}
  - {name: DOS id as text, create: "CREATE (:DosEntity {dosId: 'x', name: 'ACME LLC', nameKey: 'ACME LLC', entityType: 'DOMESTIC LIMITED LIABILITY COMPANY', filingDate: date('2020-01-01')})", rule: DosEntityShape.dosId.datatype}
  - {name: DOS entity without name, create: "CREATE (:DosEntity {dosId: 999999999, nameKey: 'ACME LLC', entityType: 'DOMESTIC LIMITED LIABILITY COMPANY', filingDate: date('2020-01-01')})", rule: DosEntityShape.dosEntityName.minCount}
  - {name: DOS entity with empty name, create: "CREATE (:DosEntity {dosId: 999999999, name: '', nameKey: 'ACME LLC', entityType: 'DOMESTIC LIMITED LIABILITY COMPANY', filingDate: date('2020-01-01')})", rule: DosEntityShape.dosEntityName.minLength}
  - {name: DOS entity without type, create: "CREATE (:DosEntity {dosId: 999999999, name: 'ACME LLC', nameKey: 'ACME LLC', filingDate: date('2020-01-01')})", rule: DosEntityShape.entityType.minCount}
  - {name: DOS entity without filing date, create: "CREATE (:DosEntity {dosId: 999999999, name: 'ACME LLC', nameKey: 'ACME LLC', entityType: 'DOMESTIC LIMITED LIABILITY COMPANY'})", rule: DosEntityShape.initialFilingDate.minCount}
  - {name: filing date as text, create: "CREATE (:DosEntity {dosId: 999999999, name: 'ACME LLC', nameKey: 'ACME LLC', entityType: 'DOMESTIC LIMITED LIABILITY COMPANY', filingDate: '2020-01-01'})", rule: DosEntityShape.initialFilingDate.datatype}
  - {name: empty jurisdiction, create: "CREATE (:DosEntity {dosId: 999999999, name: 'ACME LLC', nameKey: 'ACME LLC', entityType: 'DOMESTIC LIMITED LIABILITY COMPANY', filingDate: date('2020-01-01'), jurisdiction: ''})", rule: DosEntityShape.jurisdiction.minLength}
  - {name: empty process name, create: "CREATE (:DosEntity {dosId: 999999999, name: 'ACME LLC', nameKey: 'ACME LLC', entityType: 'DOMESTIC LIMITED LIABILITY COMPANY', filingDate: date('2020-01-01'), processName: ''})", rule: DosEntityShape.processName.minLength}
  - {name: empty process address, create: "CREATE (:DosEntity {dosId: 999999999, name: 'ACME LLC', nameKey: 'ACME LLC', entityType: 'DOMESTIC LIMITED LIABILITY COMPANY', filingDate: date('2020-01-01'), processAddress: ''})", rule: DosEntityShape.processAddress.minLength}
  - {name: empty process address line 2, create: "CREATE (:DosEntity {dosId: 999999999, name: 'ACME LLC', nameKey: 'ACME LLC', entityType: 'DOMESTIC LIMITED LIABILITY COMPANY', filingDate: date('2020-01-01'), processAddressLine2: ''})", rule: DosEntityShape.processAddressLineTwo.minLength}
  - {name: empty process city, create: "CREATE (:DosEntity {dosId: 999999999, name: 'ACME LLC', nameKey: 'ACME LLC', entityType: 'DOMESTIC LIMITED LIABILITY COMPANY', filingDate: date('2020-01-01'), processCity: ''})", rule: DosEntityShape.processCity.minLength}
  - {name: empty process state, create: "CREATE (:DosEntity {dosId: 999999999, name: 'ACME LLC', nameKey: 'ACME LLC', entityType: 'DOMESTIC LIMITED LIABILITY COMPANY', filingDate: date('2020-01-01'), processState: ''})", rule: DosEntityShape.processState.minLength}
  - {name: empty process zip, create: "CREATE (:DosEntity {dosId: 999999999, name: 'ACME LLC', nameKey: 'ACME LLC', entityType: 'DOMESTIC LIMITED LIABILITY COMPANY', filingDate: date('2020-01-01'), processZip: ''})", rule: DosEntityShape.processZip.minLength}
  - {name: empty agent name, create: "CREATE (:DosEntity {dosId: 999999999, name: 'ACME LLC', nameKey: 'ACME LLC', entityType: 'DOMESTIC LIMITED LIABILITY COMPANY', filingDate: date('2020-01-01'), agentName: ''})", rule: DosEntityShape.registeredAgentName.minLength}
  - {name: empty agent address, create: "CREATE (:DosEntity {dosId: 999999999, name: 'ACME LLC', nameKey: 'ACME LLC', entityType: 'DOMESTIC LIMITED LIABILITY COMPANY', filingDate: date('2020-01-01'), agentAddress: ''})", rule: DosEntityShape.registeredAgentAddress.minLength}
  - {name: empty agent address line 2, create: "CREATE (:DosEntity {dosId: 999999999, name: 'ACME LLC', nameKey: 'ACME LLC', entityType: 'DOMESTIC LIMITED LIABILITY COMPANY', filingDate: date('2020-01-01'), agentAddressLine2: ''})", rule: DosEntityShape.registeredAgentAddressLineTwo.minLength}
  - {name: empty agent city, create: "CREATE (:DosEntity {dosId: 999999999, name: 'ACME LLC', nameKey: 'ACME LLC', entityType: 'DOMESTIC LIMITED LIABILITY COMPANY', filingDate: date('2020-01-01'), agentCity: ''})", rule: DosEntityShape.registeredAgentCity.minLength}
  - {name: empty agent state, create: "CREATE (:DosEntity {dosId: 999999999, name: 'ACME LLC', nameKey: 'ACME LLC', entityType: 'DOMESTIC LIMITED LIABILITY COMPANY', filingDate: date('2020-01-01'), agentState: ''})", rule: DosEntityShape.registeredAgentState.minLength}
  - {name: empty agent zip, create: "CREATE (:DosEntity {dosId: 999999999, name: 'ACME LLC', nameKey: 'ACME LLC', entityType: 'DOMESTIC LIMITED LIABILITY COMPANY', filingDate: date('2020-01-01'), agentZip: ''})", rule: DosEntityShape.registeredAgentZip.minLength}
  - {name: filing date after the snapshot, create: "CREATE (:DosEntity {dosId: 999999999, name: 'ACME LLC', nameKey: 'ACME LLC', entityType: 'DOMESTIC LIMITED LIABILITY COMPANY', filingDate: date('2026-07-07')})", check: queries/checks/q05-filing-date-not-future.cypher}
  - {name: DOS entity linked to an owner contact, create: "MATCH (o:OwnerContact) WITH o LIMIT 1 CREATE (:DosEntity {dosId: 999999999, name: 'ACME LLC', nameKey: 'ACME LLC', entityType: 'DOMESTIC LIMITED LIABILITY COMPANY', filingDate: date('2020-01-01')})-[:LINKED]->(o)", check: queries/checks/q05-no-relationships.cypher}
  - {name: name key not N3 of the name, create: "CREATE (:DosEntity {dosId: 999999999, name: 'ACME LLC', nameKey: 'WRONG', entityType: 'DOMESTIC LIMITED LIABILITY COMPANY', filingDate: date('2020-01-01')})", check: queries/checks/q05-name-key-scope.cypher}
  - {name: DOS entity outside the scope, create: "CREATE (:DosEntity {dosId: 999999999, name: 'ZZQ NO SUCH OWNER LLC', nameKey: 'ZZQ NO SUCH OWNER LLC', entityType: 'DOMESTIC LIMITED LIABILITY COMPANY', filingDate: date('2020-01-01')})", check: queries/checks/q05-name-key-scope.cypher}
  - {name: duplicate dosId, create: "MATCH (e:DosEntity) WITH e LIMIT 1 CREATE (:DosEntity {dosId: e.dosId})", error: constraint}
