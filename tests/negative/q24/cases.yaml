# Same format as tests/negative/q22/cases.yaml: bad data inside a transaction that is always rolled back.
# Cases reuse the existing property key `status` so no new key token is created and the check keeps its catalog fast path.
# The Q24-only keys, relationship types and labels (matchBasis, NAME_MATCH, NameSearch, ...) are guarded by the check but not seeded here.
cases:
  - {name: status stored on a contact,    create: "MATCH (n:Contact) WITH n LIMIT 1 SET n.status = 'match'", check: queries/checks/q24-computed-not-stored.cypher}
  - {name: status stored on a grantee,    create: "MATCH (n:Grantee) WITH n LIMIT 1 SET n.status = 'match'", check: queries/checks/q24-computed-not-stored.cypher}
  - {name: status stored on a grantor,    create: "MATCH (n:Grantor) WITH n LIMIT 1 SET n.status = 'match'", check: queries/checks/q24-computed-not-stored.cypher}
  - {name: status stored on a DOS entity, create: "MATCH (n:DosEntity) WITH n LIMIT 1 SET n.status = 'match'", check: queries/checks/q24-computed-not-stored.cypher}
