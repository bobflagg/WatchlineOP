# Same format as tests/negative/q15/cases.yaml: bad data inside a transaction that is always rolled back.
cases:
  - {name: problem without id, create: "MATCH (b:Building) WITH b LIMIT 1 CREATE (b)-[:HAS_PROBLEM]->(:Problem {complaintId: -1, problemType: 'EMERGENCY', majorCategory: 'PLUMBING', status: 'OPEN', receivedDate: date('2024-01-01'), duplicate: false})", rule: ProblemShape.problemId.minCount}
  - {name: problem id as text, create: "MATCH (b:Building) WITH b LIMIT 1 CREATE (b)-[:HAS_PROBLEM]->(:Problem {problemId: 'x', complaintId: -1, problemType: 'EMERGENCY', majorCategory: 'PLUMBING', status: 'OPEN', receivedDate: date('2024-01-01'), duplicate: false})", rule: ProblemShape.problemId.datatype}
  - {name: problem without complaint id, create: "MATCH (b:Building) WITH b LIMIT 1 CREATE (b)-[:HAS_PROBLEM]->(:Problem {problemId: -1, problemType: 'EMERGENCY', majorCategory: 'PLUMBING', status: 'OPEN', receivedDate: date('2024-01-01'), duplicate: false})", rule: ProblemShape.complaintId.minCount}
  - {name: complaint id as text, create: "MATCH (b:Building) WITH b LIMIT 1 CREATE (b)-[:HAS_PROBLEM]->(:Problem {problemId: -1, complaintId: 'x', problemType: 'EMERGENCY', majorCategory: 'PLUMBING', status: 'OPEN', receivedDate: date('2024-01-01'), duplicate: false})", rule: ProblemShape.complaintId.datatype}
  - {name: problem without type, create: "MATCH (b:Building) WITH b LIMIT 1 CREATE (b)-[:HAS_PROBLEM]->(:Problem {problemId: -1, complaintId: -1, majorCategory: 'PLUMBING', status: 'OPEN', receivedDate: date('2024-01-01'), duplicate: false})", rule: ProblemShape.problemType.minCount}
  - {name: problem of type URGENT, create: "MATCH (b:Building) WITH b LIMIT 1 CREATE (b)-[:HAS_PROBLEM]->(:Problem {problemId: -1, complaintId: -1, problemType: 'URGENT', majorCategory: 'PLUMBING', status: 'OPEN', receivedDate: date('2024-01-01'), duplicate: false})", rule: ProblemShape.problemType.in}
  - {name: problem without category, create: "MATCH (b:Building) WITH b LIMIT 1 CREATE (b)-[:HAS_PROBLEM]->(:Problem {problemId: -1, complaintId: -1, problemType: 'EMERGENCY', status: 'OPEN', receivedDate: date('2024-01-01'), duplicate: false})", rule: ProblemShape.majorCategory.minCount}
  - {name: problem without status, create: "MATCH (b:Building) WITH b LIMIT 1 CREATE (b)-[:HAS_PROBLEM]->(:Problem {problemId: -1, complaintId: -1, problemType: 'EMERGENCY', majorCategory: 'PLUMBING', receivedDate: date('2024-01-01'), duplicate: false})", rule: ProblemShape.problemStatus.minCount}
  - {name: problem with status CLOSED, create: "MATCH (b:Building) WITH b LIMIT 1 CREATE (b)-[:HAS_PROBLEM]->(:Problem {problemId: -1, complaintId: -1, problemType: 'EMERGENCY', majorCategory: 'PLUMBING', status: 'CLOSED', receivedDate: date('2024-01-01'), duplicate: false})", rule: ProblemShape.problemStatus.in}
  - {name: problem without received date, create: "MATCH (b:Building) WITH b LIMIT 1 CREATE (b)-[:HAS_PROBLEM]->(:Problem {problemId: -1, complaintId: -1, problemType: 'EMERGENCY', majorCategory: 'PLUMBING', status: 'OPEN', duplicate: false})", rule: ProblemShape.receivedDate.minCount}
  - {name: received date as text, create: "MATCH (b:Building) WITH b LIMIT 1 CREATE (b)-[:HAS_PROBLEM]->(:Problem {problemId: -1, complaintId: -1, problemType: 'EMERGENCY', majorCategory: 'PLUMBING', status: 'OPEN', receivedDate: '2024-01-01', duplicate: false})", rule: ProblemShape.receivedDate.datatype}
  - {name: problem without duplicate flag, create: "MATCH (b:Building) WITH b LIMIT 1 CREATE (b)-[:HAS_PROBLEM]->(:Problem {problemId: -1, complaintId: -1, problemType: 'EMERGENCY', majorCategory: 'PLUMBING', status: 'OPEN', receivedDate: date('2024-01-01')})", rule: ProblemShape.duplicateFlag.minCount}
  - {name: duplicate flag as text, create: "MATCH (b:Building) WITH b LIMIT 1 CREATE (b)-[:HAS_PROBLEM]->(:Problem {problemId: -1, complaintId: -1, problemType: 'EMERGENCY', majorCategory: 'PLUMBING', status: 'OPEN', receivedDate: date('2024-01-01'), duplicate: 'no'})", rule: ProblemShape.duplicateFlag.datatype}
  - {name: problem with no building, create: "CREATE (:Problem {problemId: -1, complaintId: -1, problemType: 'EMERGENCY', majorCategory: 'PLUMBING', status: 'OPEN', receivedDate: date('2024-01-01'), duplicate: false})", rule: ProblemShape.inv_hasProblem.minCount}
  - {name: problem carried by two buildings, create: "MATCH (b1:Building), (b2:Building) WHERE b1.bin < b2.bin WITH b1, b2 LIMIT 1 CREATE (b1)-[:HAS_PROBLEM]->(v:Problem {problemId: -1, complaintId: -1, problemType: 'EMERGENCY', majorCategory: 'PLUMBING', status: 'OPEN', receivedDate: date('2024-01-01'), duplicate: false}), (b2)-[:HAS_PROBLEM]->(v)", rule: ProblemShape.inv_hasProblem.maxCount}
  - {name: duplicate problem id, create: "MATCH (p:Problem) WITH p LIMIT 1 CREATE (:Problem {problemId: p.problemId, complaintId: -1, problemType: 'EMERGENCY', majorCategory: 'PLUMBING', status: 'OPEN', receivedDate: date('2024-01-01'), duplicate: false})", error: constraint}
  - {name: problem link ends on a lot, create: "MATCH (b:Building), (l:Lot) WITH b, l LIMIT 1 CREATE (b)-[:HAS_PROBLEM]->(l)", rule: BuildingProblemShape.hasProblem.class}
  - {name: problem link from a lot, create: "MATCH (l:Lot), (p:Problem) WITH l, p LIMIT 1 CREATE (l)-[:HAS_PROBLEM]->(p)", check: queries/checks/q27-problems.cypher}
  - {name: problem link with a property, create: "MATCH (:Building)-[r:HAS_PROBLEM]->(:Problem) WITH r LIMIT 1 SET r.rate = 0.5", check: queries/checks/q27-problems.cypher}
  - {name: rate stored on a lot, create: "MATCH (l:Lot) WITH l LIMIT 1 SET l.complaintRate = 0.84", check: queries/checks/q27-problems.cypher}
  - {name: problem count stored on a building, create: "MATCH (b:Building) WITH b LIMIT 1 SET b.problemCount = 27", check: queries/checks/q27-problems.cypher}
  - {name: problem received before the loaded window, create: "MATCH (b:Building) WITH b LIMIT 1 CREATE (b)-[:HAS_PROBLEM]->(:Problem {problemId: -2, complaintId: -1, problemType: 'EMERGENCY', majorCategory: 'PLUMBING', status: 'OPEN', receivedDate: date('2019-05-01'), duplicate: false})", check: queries/checks/q27-problems.cypher}
  - {name: apartment stored on a problem, create: "MATCH (p:Problem) WITH p LIMIT 1 SET p.apartment = '3A'", check: queries/checks/q27-problems.cypher}
  - {name: coordinates stored on a problem, create: "MATCH (p:Problem) WITH p LIMIT 1 SET p.latitude = 40.65", check: queries/checks/q27-problems.cypher}
  - {name: problem without minor category, create: "MATCH (b:Building) WITH b LIMIT 1 CREATE (b)-[:HAS_PROBLEM]->(:Problem {problemId: -1, complaintId: -1, problemType: 'EMERGENCY', majorCategory: 'UNSANITARY CONDITION', status: 'OPEN', receivedDate: date('2024-01-01'), duplicate: false, problemCode: 'MICE'})", rule: ProblemShape.minorCategory.minCount}
  - {name: minor category as a number, create: "MATCH (b:Building) WITH b LIMIT 1 CREATE (b)-[:HAS_PROBLEM]->(:Problem {problemId: -1, complaintId: -1, problemType: 'EMERGENCY', majorCategory: 'UNSANITARY CONDITION', status: 'OPEN', receivedDate: date('2024-01-01'), duplicate: false, minorCategory: 7, problemCode: 'MICE'})", rule: ProblemShape.minorCategory.datatype}
  - {name: problem without problem code, create: "MATCH (b:Building) WITH b LIMIT 1 CREATE (b)-[:HAS_PROBLEM]->(:Problem {problemId: -1, complaintId: -1, problemType: 'EMERGENCY', majorCategory: 'UNSANITARY CONDITION', status: 'OPEN', receivedDate: date('2024-01-01'), duplicate: false, minorCategory: 'PESTS'})", rule: ProblemShape.problemCode.minCount}
  - {name: problem code in lower case, create: "MATCH (b:Building) WITH b LIMIT 1 CREATE (b)-[:HAS_PROBLEM]->(:Problem {problemId: -1, complaintId: -1, problemType: 'EMERGENCY', majorCategory: 'UNSANITARY CONDITION', status: 'OPEN', receivedDate: date('2024-01-01'), duplicate: false, minorCategory: 'PESTS', problemCode: 'mice'})", rule: ProblemShape.problemCode.pattern}
  - {name: pest problem with a non-pest code, create: "MATCH (b:Building) WITH b LIMIT 1 CREATE (b)-[:HAS_PROBLEM]->(:Problem {problemId: -1, complaintId: -1, problemType: 'EMERGENCY', majorCategory: 'UNSANITARY CONDITION', status: 'OPEN', receivedDate: date('2024-01-01'), duplicate: false, minorCategory: 'PESTS', problemCode: 'LEAKS'})", check: queries/checks/q27-problems.cypher}
  - {name: pest kind stored on a problem, create: "MATCH (p:Problem) WITH p LIMIT 1 SET p.pestKind = 'mice'", check: queries/checks/q27-problems.cypher}
