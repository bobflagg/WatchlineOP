# Same format as tests/negative/q13/cases.yaml: bad data inside a transaction that is always rolled back.
cases:
  - {name: violation without id,               create: "MATCH (b:Building) WITH b LIMIT 1 CREATE (b)-[:HAS_VIOLATION]->(:Violation {violationClass: 'A', status: 'Open', inspectionDate: date('2020-01-01')})", rule: ViolationShape.violationId.minCount}
  - {name: violation id as text,               create: "MATCH (b:Building) WITH b LIMIT 1 CREATE (b)-[:HAS_VIOLATION]->(:Violation {violationId: 'x', violationClass: 'A', status: 'Open', inspectionDate: date('2020-01-01')})", rule: ViolationShape.violationId.datatype}
  - {name: violation without class,            create: "MATCH (b:Building) WITH b LIMIT 1 CREATE (b)-[:HAS_VIOLATION]->(:Violation {violationId: -1, status: 'Open', inspectionDate: date('2020-01-01')})", rule: ViolationShape.violationClass.minCount}
  - {name: violation of class D,               create: "MATCH (b:Building) WITH b LIMIT 1 CREATE (b)-[:HAS_VIOLATION]->(:Violation {violationId: -1, violationClass: 'D', status: 'Open', inspectionDate: date('2020-01-01')})", rule: ViolationShape.violationClass.in}
  - {name: violation without status,           create: "MATCH (b:Building) WITH b LIMIT 1 CREATE (b)-[:HAS_VIOLATION]->(:Violation {violationId: -1, violationClass: 'A', inspectionDate: date('2020-01-01')})", rule: ViolationShape.violationStatus.minCount}
  - {name: violation with status Dismissed,    create: "MATCH (b:Building) WITH b LIMIT 1 CREATE (b)-[:HAS_VIOLATION]->(:Violation {violationId: -1, violationClass: 'A', status: 'Dismissed', inspectionDate: date('2020-01-01')})", rule: ViolationShape.violationStatus.in}
  - {name: violation without inspection date,  create: "MATCH (b:Building) WITH b LIMIT 1 CREATE (b)-[:HAS_VIOLATION]->(:Violation {violationId: -1, violationClass: 'A', status: 'Open'})", rule: ViolationShape.inspectionDate.minCount}
  - {name: inspection date as text,            create: "MATCH (b:Building) WITH b LIMIT 1 CREATE (b)-[:HAS_VIOLATION]->(:Violation {violationId: -1, violationClass: 'A', status: 'Open', inspectionDate: '2020-01-01'})", rule: ViolationShape.inspectionDate.datatype}
  - {name: violation without order number,    create: "MATCH (b:Building) WITH b LIMIT 1 CREATE (b)-[:HAS_VIOLATION]->(:Violation {violationId: -1, violationClass: 'A', status: 'Open', inspectionDate: date('2020-01-01')})", rule: ViolationShape.orderNumber.minCount}
  - {name: order number as integer,            create: "MATCH (b:Building) WITH b LIMIT 1 CREATE (b)-[:HAS_VIOLATION]->(:Violation {violationId: -1, violationClass: 'A', status: 'Open', inspectionDate: date('2020-01-01'), orderNumber: 569})", rule: ViolationShape.orderNumber.datatype}
  - {name: order number with a leading zero,   create: "MATCH (b:Building) WITH b LIMIT 1 CREATE (b)-[:HAS_VIOLATION]->(:Violation {violationId: -1, violationClass: 'A', status: 'Open', inspectionDate: date('2020-01-01'), orderNumber: '0569'})", rule: ViolationShape.orderNumber.pattern}
  - {name: violation with no building,         create: "CREATE (:Violation {violationId: -1, violationClass: 'A', status: 'Open', inspectionDate: date('2020-01-01')})", rule: ViolationShape.inv_hasViolation.minCount}
  - {name: violation cited by two buildings,   create: "MATCH (b1:Building), (b2:Building) WHERE b1.bin < b2.bin WITH b1, b2 LIMIT 1 CREATE (b1)-[:HAS_VIOLATION]->(v:Violation {violationId: -1, violationClass: 'A', status: 'Open', inspectionDate: date('2020-01-01')}), (b2)-[:HAS_VIOLATION]->(v)", rule: ViolationShape.inv_hasViolation.maxCount}
  - {name: duplicate violation id,             create: "MATCH (v:Violation) WITH v LIMIT 1 CREATE (:Violation {violationId: v.violationId, violationClass: 'A', status: 'Open', inspectionDate: date('2020-01-01')})", error: constraint}
  - {name: violation link ends on a lot,       create: "MATCH (b:Building), (l:Lot) WITH b, l LIMIT 1 CREATE (b)-[:HAS_VIOLATION]->(l)", rule: BuildingViolationShape.hasViolation.class}
  - {name: violation link from a lot,          create: "MATCH (l:Lot), (v:Violation) WITH l, v LIMIT 1 CREATE (l)-[:HAS_VIOLATION]->(v)", check: queries/checks/q15-violations.cypher}
  - {name: violation link with a property,     create: "MATCH (:Building)-[r:HAS_VIOLATION]->(:Violation) WITH r LIMIT 1 SET r.rate = 0.5", check: queries/checks/q15-violations.cypher}
  - {name: rate stored on a lot,               create: "MATCH (l:Lot) WITH l LIMIT 1 SET l.openRate = 0.125", check: queries/checks/q15-violations.cypher}
  - {name: open count stored on a building,    create: "MATCH (b:Building) WITH b LIMIT 1 SET b.openViolations = 4", check: queries/checks/q15-violations.cypher}
  - {name: oldest date stored on a violation,  create: "MATCH (v:Violation) WITH v LIMIT 1 SET v.oldestOpen = date('2020-01-01')", check: queries/checks/q15-violations.cypher}
  - {name: pest kind stored on a violation,    create: "MATCH (v:Violation) WITH v LIMIT 1 SET v.pestKind = 'mice'", check: queries/checks/q15-violations.cypher}
  - {name: description stored on a violation,  create: "MATCH (v:Violation) WITH v LIMIT 1 SET v.novDescription = 'x'", check: queries/checks/q15-violations.cypher}
  - {name: apartment stored on a violation,    create: "MATCH (v:Violation) WITH v LIMIT 1 SET v.apartment = '3A'", check: queries/checks/q15-violations.cypher}
