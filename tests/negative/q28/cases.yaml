# Same format as tests/negative/q27/cases.yaml: bad data inside a transaction that is always rolled back.
cases:
  - {name: case without id, create: "MATCH (b:Building) WITH b LIMIT 1 CREATE (b)-[:HAS_LITIGATION]->(:Litigation {caseType: 'Tenant Action', caseStatus: 'CLOSED', openJudgement: 'NO'})", rule: LitigationShape.litigationId.minCount}
  - {name: case id as text, create: "MATCH (b:Building) WITH b LIMIT 1 CREATE (b)-[:HAS_LITIGATION]->(:Litigation {litigationId: 'x', caseType: 'Tenant Action', caseStatus: 'CLOSED', openJudgement: 'NO'})", rule: LitigationShape.litigationId.datatype}
  - {name: case without type, create: "MATCH (b:Building) WITH b LIMIT 1 CREATE (b)-[:HAS_LITIGATION]->(:Litigation {litigationId: -1, caseStatus: 'CLOSED', openJudgement: 'NO'})", rule: LitigationShape.caseType.minCount}
  - {name: case type as number, create: "MATCH (b:Building) WITH b LIMIT 1 CREATE (b)-[:HAS_LITIGATION]->(:Litigation {litigationId: -1, caseType: 5, caseStatus: 'CLOSED', openJudgement: 'NO'})", rule: LitigationShape.caseType.datatype}
  - {name: case without status, create: "MATCH (b:Building) WITH b LIMIT 1 CREATE (b)-[:HAS_LITIGATION]->(:Litigation {litigationId: -1, caseType: 'Tenant Action', openJudgement: 'NO'})", rule: LitigationShape.caseStatus.minCount}
  - {name: case status as number, create: "MATCH (b:Building) WITH b LIMIT 1 CREATE (b)-[:HAS_LITIGATION]->(:Litigation {litigationId: -1, caseType: 'Tenant Action', caseStatus: 5, openJudgement: 'NO'})", rule: LitigationShape.caseStatus.datatype}
  - {name: case without open judgement, create: "MATCH (b:Building) WITH b LIMIT 1 CREATE (b)-[:HAS_LITIGATION]->(:Litigation {litigationId: -1, caseType: 'Tenant Action', caseStatus: 'CLOSED'})", rule: LitigationShape.openJudgement.minCount}
  - {name: open judgement MAYBE, create: "MATCH (b:Building) WITH b LIMIT 1 CREATE (b)-[:HAS_LITIGATION]->(:Litigation {litigationId: -1, caseType: 'Tenant Action', caseStatus: 'CLOSED', openJudgement: 'MAYBE'})", rule: LitigationShape.openJudgement.in}
  - {name: open date as text, create: "MATCH (b:Building) WITH b LIMIT 1 CREATE (b)-[:HAS_LITIGATION]->(:Litigation {litigationId: -1, caseType: 'Tenant Action', caseStatus: 'CLOSED', openJudgement: 'NO', caseOpenDate: '2024-01-01'})", rule: LitigationShape.caseOpenDate.datatype}
  - {name: finding of Guilty, create: "MATCH (b:Building) WITH b LIMIT 1 CREATE (b)-[:HAS_LITIGATION]->(:Litigation {litigationId: -1, caseType: 'Tenant Action', caseStatus: 'CLOSED', openJudgement: 'NO', harassmentFinding: 'Guilty'})", rule: LitigationShape.harassmentFinding.in}
  - {name: finding date as text, create: "MATCH (b:Building) WITH b LIMIT 1 CREATE (b)-[:HAS_LITIGATION]->(:Litigation {litigationId: -1, caseType: 'Tenant Action', caseStatus: 'CLOSED', openJudgement: 'NO', harassmentFinding: 'After Trial', findingDate: '2024-01-01'})", rule: LitigationShape.findingDate.datatype}
  - {name: negative penalty, create: "MATCH (b:Building) WITH b LIMIT 1 CREATE (b)-[:HAS_LITIGATION]->(:Litigation {litigationId: -1, caseType: 'Tenant Action', caseStatus: 'CLOSED', openJudgement: 'NO', penalty: -5})", rule: LitigationShape.penalty.minInclusive}
  - {name: penalty as text, create: "MATCH (b:Building) WITH b LIMIT 1 CREATE (b)-[:HAS_LITIGATION]->(:Litigation {litigationId: -1, caseType: 'Tenant Action', caseStatus: 'CLOSED', openJudgement: 'NO', penalty: '1000'})", rule: LitigationShape.penalty.datatype}
  - {name: respondent as number, create: "MATCH (b:Building) WITH b LIMIT 1 CREATE (b)-[:HAS_LITIGATION]->(:Litigation {litigationId: -1, caseType: 'Tenant Action', caseStatus: 'CLOSED', openJudgement: 'NO', respondent: 7})", rule: LitigationShape.respondent.datatype}
  - {name: case with no building, create: "CREATE (:Litigation {litigationId: -1, caseType: 'Tenant Action', caseStatus: 'CLOSED', openJudgement: 'NO'})", rule: LitigationShape.inv_hasLitigation.minCount}
  - {name: case carried by two buildings, create: "MATCH (b1:Building), (b2:Building) WHERE b1.bin < b2.bin WITH b1, b2 LIMIT 1 CREATE (b1)-[:HAS_LITIGATION]->(v:Litigation {litigationId: -1, caseType: 'Tenant Action', caseStatus: 'CLOSED', openJudgement: 'NO'}), (b2)-[:HAS_LITIGATION]->(v)", rule: LitigationShape.inv_hasLitigation.maxCount}
  - {name: duplicate case id, create: "MATCH (c:Litigation) WITH c LIMIT 1 CREATE (:Litigation {litigationId: c.litigationId, caseType: 'Tenant Action', caseStatus: 'CLOSED', openJudgement: 'NO'})", error: constraint}
  - {name: case link ends on a lot, create: "MATCH (b:Building), (l:Lot) WITH b, l LIMIT 1 CREATE (b)-[:HAS_LITIGATION]->(l)", rule: BuildingLitigationShape.hasLitigation.class}
  - {name: case link from a lot, create: "MATCH (l:Lot), (c:Litigation) WITH l, c LIMIT 1 CREATE (l)-[:HAS_LITIGATION]->(c)", check: queries/checks/q28-litigation.cypher}
  - {name: case link with a property, create: "MATCH (:Building)-[r:HAS_LITIGATION]->(:Litigation) WITH r LIMIT 1 SET r.ownerMatch = true", check: queries/checks/q28-litigation.cypher}
  - {name: owner match stored on a case, create: "MATCH (c:Litigation) WITH c LIMIT 1 SET c.ownerMatch = true", check: queries/checks/q28-litigation.cypher}
  - {name: case count stored on a building, create: "MATCH (b:Building) WITH b LIMIT 1 SET b.litigationCount = 3", check: queries/checks/q28-litigation.cypher}
  - {name: case count stored on a lot, create: "MATCH (l:Lot) WITH l LIMIT 1 SET l.cases = 3", check: queries/checks/q28-litigation.cypher}
  - {name: finding date without a finding, create: "MATCH (c:Litigation) WHERE c.harassmentFinding IS NULL WITH c LIMIT 1 SET c.findingDate = date('2020-01-01')", check: queries/checks/q28-litigation.cypher}
  - {name: finding date with No Harassment, create: "MATCH (c:Litigation {harassmentFinding: 'No Harassment'}) WITH c LIMIT 1 SET c.findingDate = date('2020-01-01')", check: queries/checks/q28-litigation.cypher}
  - {name: respondent keys without a respondent, create: "MATCH (c:Litigation) WHERE c.respondent IS NULL WITH c LIMIT 1 SET c.respondentKeys = ['A B']", check: queries/checks/q28-litigation.cypher}
  - {name: respondent keys empty list, create: "MATCH (c:Litigation) WHERE c.respondent IS NOT NULL WITH c LIMIT 1 SET c.respondentKeys = []", check: queries/checks/q28-litigation.cypher}
  - {name: empty respondent string, create: "MATCH (c:Litigation) WITH c LIMIT 1 SET c.respondent = ''", check: queries/checks/q28-litigation.cypher}
  - {name: address stored on a case, create: "MATCH (c:Litigation) WITH c LIMIT 1 SET c.address = '438 52 Street'", check: queries/checks/q28-litigation.cypher}
  - {name: judgement amount stored on a case, create: "MATCH (c:Litigation) WITH c LIMIT 1 SET c.judgementAmount = 1000", check: queries/checks/q28-litigation.cypher}
