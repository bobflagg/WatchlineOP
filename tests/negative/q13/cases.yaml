# Same format as tests/negative/q12/cases.yaml: bad data inside a transaction that is always rolled back.
cases:
  - {name: financing link ends on a building, create: "MATCH (l:Lot), (b:Building) WITH l, b LIMIT 1 CREATE (l)-[:HAS_FINANCING_DOCUMENT]->(b)", rule: LotFinancingShape.hasFinancingDocument.class}
  - {name: financing document without id,      create: "MATCH (l:Lot) WITH l LIMIT 1 CREATE (l)-[:HAS_FINANCING_DOCUMENT]->(d:Document {docType: 'MTGE'})-[:HAS_PARTY {partyType: 1}]->(:DocumentParty {partyKey: 'q13-x'})", rule: DocumentShape.documentId.minCount}
  - {name: financing document without type,    create: "MATCH (l:Lot) WITH l LIMIT 1 CREATE (l)-[:HAS_FINANCING_DOCUMENT]->(d:Document {documentId: 'q13-x'})-[:HAS_PARTY {partyType: 1}]->(:DocumentParty {partyKey: 'q13-x1'})", rule: DocumentShape.documentType.minCount}
  - {name: financing document without a party, create: "MATCH (l:Lot) WITH l LIMIT 1 CREATE (l)-[:HAS_FINANCING_DOCUMENT]->(:Document {documentId: 'q13-x', docType: 'MTGE'})", rule: DocumentShape.hasParty.minCount}
  - {name: financing document with negative amount, create: "MATCH (l:Lot) WITH l LIMIT 1 CREATE (l)-[:HAS_FINANCING_DOCUMENT]->(d:Document {documentId: 'q13-x', docType: 'MTGE', amount: -1})-[:HAS_PARTY {partyType: 1}]->(:DocumentParty {partyKey: 'q13-x1'})", rule: DocumentShape.documentAmount.minInclusive}
  - {name: financing document of another type, create: "MATCH (l:Lot) WITH l LIMIT 1 CREATE (l)-[:HAS_FINANCING_DOCUMENT]->(d:Document {documentId: 'q13-x', docType: 'DEED'})-[:HAS_PARTY {partyType: 1}]->(:DocumentParty {partyKey: 'q13-x1'})", check: queries/checks/q13-financing.cypher}
  - {name: financing link from a building,     create: "MATCH (b:Building), (d:Document) WITH b, d LIMIT 1 CREATE (b)-[:HAS_FINANCING_DOCUMENT]->(d)", check: queries/checks/q13-financing.cypher}
  - {name: financing link with a property,     create: "MATCH (:Lot)-[r:HAS_FINANCING_DOCUMENT]->(:Document) WITH r LIMIT 1 SET r.kind = 'mortgage'", check: queries/checks/q13-financing.cypher}
  - {name: kind stored on a document,          create: "MATCH (:Lot)-[:HAS_FINANCING_DOCUMENT]->(d:Document) WITH d LIMIT 1 SET d.kind = 'mortgage'", check: queries/checks/q13-financing.cypher}
  - {name: outstanding flag stored on a document, create: "MATCH (:Lot)-[:HAS_FINANCING_DOCUMENT]->(d:Document {docType: 'MTGE'}) WITH d LIMIT 1 SET d.outstanding = true", check: queries/checks/q13-financing.cypher}
  - {name: hub count on a party with no address, create: "MATCH (:Lot)-[:HAS_FINANCING_DOCUMENT]->(d:Document) WITH d LIMIT 1 CREATE (d)-[:HAS_PARTY {partyType: 1}]->(:DocumentParty {partyKey: 'q13-x', addressNames: 1, addressDocuments: 1})", check: queries/checks/q13-financing.cypher}
  - {name: scope F party with an address and no hub count in a non-financing document, create: "MATCH (d:Document) WHERE NOT ()-[:HAS_FINANCING_DOCUMENT]->(d) WITH d LIMIT 1 CREATE (d)-[:HAS_PARTY {partyType: 1}]->(:DocumentParty {partyKey: 'q13-x', mailingAddress: '1 TEST ST'})", check: queries/checks/q07-documents.cypher}
