# Same format as tests/negative/q03/cases.yaml: bad data inside a transaction that is always rolled back.
cases:
  - {name: contact with empty title, create: "MATCH (r:Registration) WITH r LIMIT 1 CREATE (r)-[:HAS_CONTACT]->(:Contact {contactKey: 'x', contactType: 'Agent', title: ''})", rule: ContactTitleShape.contactTitle.minLength}
  - {name: contact with empty address, create: "MATCH (r:Registration) WITH r LIMIT 1 CREATE (r)-[:HAS_CONTACT]->(:Contact {contactKey: 'x', contactType: 'Agent', mailingAddress: ''})", rule: ContactAddressShape.mailingAddress.minLength}
  - {name: contact with empty zip,   create: "MATCH (r:Registration) WITH r LIMIT 1 CREATE (r)-[:HAS_CONTACT]->(:Contact {contactKey: 'x', contactType: 'Agent', zip: ''})", rule: ContactAddressShape.zipCode.minLength}
  - {name: corporation name on a head officer, create: "MATCH (r:Registration) WITH r LIMIT 1 CREATE (r)-[:HAS_CONTACT]->(:Contact {contactKey: 'x', contactType: 'HeadOfficer', corporationName: 'ACME'})", check: queries/checks/q04-corporation-name-types.cypher}
  - {name: site manager with an address,  create: "MATCH (r:Registration) WITH r LIMIT 1 CREATE (r)-[:HAS_CONTACT]->(:Contact {contactKey: 'x', contactType: 'SiteManager', mailingAddress: '1 MAIN STREET'})", check: queries/checks/q04-site-manager-address.cypher}
