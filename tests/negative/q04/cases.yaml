# Same format as tests/negative/q03/cases.yaml: bad data inside a transaction that is always rolled back.
cases:
  - {name: role contact without type,     create: "MATCH (r:Registration) WITH r LIMIT 1 CREATE (r)-[:HAS_ROLE_CONTACT]->(:RoleContact {contactKey: 'x'})", rule: RoleContactShape.contactType.minCount}
  - {name: role contact with owner type,  create: "MATCH (r:Registration) WITH r LIMIT 1 CREATE (r)-[:HAS_ROLE_CONTACT]->(:RoleContact {contactKey: 'x', contactType: 'CorporateOwner'})", rule: RoleContactShape.contactType.pattern}
  - {name: role contact type as number,   create: "MATCH (r:Registration) WITH r LIMIT 1 CREATE (r)-[:HAS_ROLE_CONTACT]->(:RoleContact {contactKey: 'x', contactType: 5})", rule: RoleContactShape.contactType.datatype}
  - {name: role contact with no registration, create: "CREATE (:RoleContact {contactKey: 'x', contactType: 'Agent'})", rule: RoleContactShape.inv_hasRoleContact.minCount}
  - {name: role contact on two registrations, create: "MATCH (c:RoleContact) WITH c LIMIT 1 MATCH (r:Registration) WHERE NOT (r)-[:HAS_ROLE_CONTACT]->(c) WITH c, r LIMIT 1 CREATE (r)-[:HAS_ROLE_CONTACT]->(c)", rule: RoleContactShape.inv_hasRoleContact.maxCount}
  - {name: HAS_ROLE_CONTACT ends on a registration, create: "MATCH (a:Registration), (b:Registration) WHERE a <> b WITH a, b LIMIT 1 CREATE (a)-[:HAS_ROLE_CONTACT]->(b)", rule: RegistrationRoleShape.hasRoleContact.class}
  - {name: role contact with empty title, create: "MATCH (r:Registration) WITH r LIMIT 1 CREATE (r)-[:HAS_ROLE_CONTACT]->(:RoleContact {contactKey: 'x', contactType: 'Agent', title: ''})", rule: RoleContactShape.contactTitle.minLength}
  - {name: role contact with empty corporation name, create: "MATCH (r:Registration) WITH r LIMIT 1 CREATE (r)-[:HAS_ROLE_CONTACT]->(:RoleContact {contactKey: 'x', contactType: 'Agent', corporationName: ''})", rule: RoleContactShape.corporationName.minLength}
  - {name: role contact with empty person name, create: "MATCH (r:Registration) WITH r LIMIT 1 CREATE (r)-[:HAS_ROLE_CONTACT]->(:RoleContact {contactKey: 'x', contactType: 'Agent', personName: ''})", rule: RoleContactShape.personName.minLength}
  - {name: person name as number,         create: "MATCH (r:Registration) WITH r LIMIT 1 CREATE (r)-[:HAS_ROLE_CONTACT]->(:RoleContact {contactKey: 'x', contactType: 'Agent', personName: 7})", rule: RoleContactShape.personName.datatype}
  - {name: role contact with empty address, create: "MATCH (r:Registration) WITH r LIMIT 1 CREATE (r)-[:HAS_ROLE_CONTACT]->(:RoleContact {contactKey: 'x', contactType: 'Agent', mailingAddress: ''})", rule: RoleContactShape.mailingAddress.minLength}
  - {name: role contact with empty zip,   create: "MATCH (r:Registration) WITH r LIMIT 1 CREATE (r)-[:HAS_ROLE_CONTACT]->(:RoleContact {contactKey: 'x', contactType: 'Agent', zip: ''})", rule: RoleContactShape.zipCode.minLength}
  - {name: corporation name on a head officer, create: "MATCH (r:Registration) WITH r LIMIT 1 CREATE (r)-[:HAS_ROLE_CONTACT]->(:RoleContact {contactKey: 'x', contactType: 'HeadOfficer', corporationName: 'ACME'})", check: queries/checks/q04-corporation-name-types.cypher}
  - {name: site manager with an address,  create: "MATCH (r:Registration) WITH r LIMIT 1 CREATE (r)-[:HAS_ROLE_CONTACT]->(:RoleContact {contactKey: 'x', contactType: 'SiteManager', mailingAddress: '1 MAIN STREET'})", check: queries/checks/q04-site-manager-address.cypher}
  - {name: duplicate contactKey,          create: "MATCH (c:RoleContact) WITH c LIMIT 1 CREATE (:RoleContact {contactKey: c.contactKey})", error: constraint}
