# Q19.1 expected state of a pair of lots per layer (BOR release v0.3.0, run 2026-05-29-869bd299).
# check_pair_state.py re-derives each from the release (groups, group_bbls, bbl_status), so a stale fixture fails.
# state: same | different | ungrouped (one or both lots in no group). Reasons are BOR's detail codes.
pairs:
  - id: identity-link
    a: "3008070024"   # anchor C, 438 52 Street
    b: "3067970008"   # 1704 East 15 Street
    operational_network: {state: same, groupA: ON-98617, groupB: ON-98617}
    owner_portfolio: {state: same, groupA: OP-98617, groupB: OP-98617}
    note: "worked example: one portfolio and one network"
  - id: no-path
    a: "3008260002"   # anchor A, 5413 7 Avenue
    b: "3008260005"   # anchor B, 702 54 Street
    operational_network: {state: ungrouped, reasonA: no_linkage, reasonB: no_linkage}
    owner_portfolio: {state: ungrouped, reasonA: no_linkage, reasonB: no_linkage}
    note: "worked example: a non-link is not a finding"
  - id: different-groups
    a: "3008070024"   # anchor C
    b: "3008210012"   # anchor D, 224 54 Street
    operational_network: {state: different, groupA: ON-98617, groupB: ON-18742}
    owner_portfolio: {state: different, groupA: OP-98617, groupB: OP-53559}
    note: "both grouped, in different groups in each layer: still not a finding of different owners"
  - id: deed-only-portfolio
    a: "4019660080"
    b: "4019660083"
