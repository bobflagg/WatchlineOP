  - {address: "909 THIRD AVENUE", degree: 281, maskedIdentities: 126, note: "also a network mask (degree 125 in the release); the highest degree"}
  - {address: "4205 EIGHTH AVENUE", degree: 42, maskedIdentities: 32, note: "masked identities sit under two ZIPs (11232, 11204); the text names no ZIP"}
  - {address: "199 LEE AVENUE 197", degree: 52, maskedIdentities: 1, note: "one identity, and its record has no ZIP"}
  - {address: "670 MYRTLE 6110", degree: 40, maskedIdentities: 1, note: "one identity"}
