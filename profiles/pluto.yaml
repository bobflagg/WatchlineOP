# Application profile: PLUTO (source key `pluto`, table public.pluto_latest, release 26v1).
# Inspected with postgres-justfix on 2026-11-11 (row count 858,602; 858,602 distinct bbl).
# Only columns used by a question are profiled; each column lists the questions using it.
profile: pluto
source_key: pluto
snapshot: {snapshot_id: pluto-26v1, snapshot_date: null, note: PLUTO has no record date}
columns:
  bbl:
    semantic_type: tax lot identifier (BBL)
    physical_type: "character(10)"
    allowed: {pattern: '^[1-5][0-9]{9}$', unique: true}
    null_policy: "no nulls (checked 2026-11-11). Keep as a string; never numeric."
    observed: "0 nulls, 0 malformed, borough digit agrees with borough/block/lot in all rows"
    concept: bbl
    used_by: [Q1.1, Q1.2, Q1.4]
  address:
    semantic_type: street address (one per lot)
    physical_type: text
    allowed: {format: "house number, space, street name as PLUTO spells it (for example 5413 7 AVENUE, 224 54 STREET)"}
    null_policy: "468 nulls; null means no PLUTO address, not an unmatched lot"
    observed: "One address per lot; other buildings' addresses on the lot are absent. Street spelling differs from HPD (7 AVENUE vs SEVENTH AVENUE; 54 STREET vs 54TH STREET)."
    concept: street-address
    used_by: [Q1.1, Q1.3]
  bldgclass:
    semantic_type: building class code (lot-level, PLUTO classification system)
    physical_type: "character(2)"
    allowed: {pattern: '^[A-Z][A-Z0-9]$', note: "Letter plus letter or digit (C1, RM, QG)"}
    null_policy: "0 SQL nulls. 355 rows are two blanks (whitespace): treat as missing and omit. 7,077 rows do not match letter+digit, most are valid letter+letter codes (RM 4,351; QG 874; RC 280)."
    observed: "Trim before testing. No padded valid codes found."
    concept: building-class
    used_by: [Q1.4]
  unitsres:
    semantic_type: residential unit count, lot-wide
    physical_type: integer
    units: residential units
    allowed: {range: [0, 10914], observed_max: 10914, note: "zero is valid and distinct from missing"}
    null_policy: "430 nulls = missing (omit). 90,301 zeros = valid zero."
    concept: residential-units
    used_by: [Q1.4]
  yearbuilt:
    semantic_type: source-reported year built, lot-level
    physical_type: smallint
    units: calendar year
    allowed: {range: [914, 2025], observed: true}
    null_policy: "358 nulls and 39,880 zeros: both mean unknown, omit (physical-implementation section 3)."
    concept: year-built
    used_by: [Q1.4]
  assesstot:
    semantic_type: total assessed value in whole US dollars
    physical_type: bigint
    units: USD, whole dollars (no cents in source)
    allowed: {range: [0, 8496376200], observed: true}
    null_policy: "358 nulls = missing (omit). 4,262 zeros: valid source value, report as given. Assessment period is not in the table; do not guess it."
    concept: assessed-value
    physical_encoding: "exact integer cents (value * 100) per physical-implementation section 3"
    used_by: [Q1.4]
  numbldgs:
    semantic_type: building count reported by PLUTO for the lot
    physical_type: integer
    units: buildings
    allowed: {range: [0, 1862], observed: true}
    null_policy: "639 nulls = missing. 33,775 zeros = valid zero in PLUTO."
    observed: "Of 180,831 PLUTO lots with an HPD registration, numbldgs equals the number of distinct HPD BINs for 155,839 and differs for 24,990. Use as a cross-check, never as the building count (BINs come only from HPD registrations)."
    concept: building-count
    used_by: [Q1.2]
  version:
    semantic_type: PLUTO release label
    physical_type: text
    allowed: {values: ["26v1"]}
    null_policy: "single value in pluto_latest"
    concept: source-snapshot
    used_by: [Q1.4]
