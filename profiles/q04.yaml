# Question schema: Q4 "Who is the managing agent, head officer or site manager HPD lists for this building?"
# (sub-questions Q4.1 and Q4.2). Extends the Q1 to Q3 graph; declares only what Q4 adds.
question: Q4
concept_base: https://watchline.example/vocab/
database: watchline
sources: [hpd_contacts]

graph:
  constraints: []

  nodes:
    Contact:   # property Q4 adds to the Q2 node
      concept: contact
      key: contactKey
      scope: >-
        Same nodes as Q2. Q4 reads the contacts whose type is not an owner type (526889 contacts, queried 2026-11-12) and
        adds the title. The names and the business address are declared by Q2 and Q3.
      proved_by: tests/q4_1/expected.sql
      properties:
        title:
          concept: contact-title
          type: string
          source: hpd_contacts.title
          rule: Trimmed, as recorded, never normalized.
          null_policy: "absent when blank (119320 of 730693 contacts have a title: 119312 role contacts and 8 owner contacts)"
          proved_by: tests/q4_1/expected.sql

  relationships: {}

answer:
  Q4.1:
    lookup: tests/q4_1/lookup.cypher
    fields:
      registrationId:  {concept: registration-id, source: Registration.registrationId, type: integer}
      contacts:        {concept: role-contact, source: "Registration-[:HAS_CONTACT]->Contact with a non-owner type", type: "list of {contactType, title, corporationName, personName}", null_policy: "empty list means no role contact is recorded; none is inferred"}
      contactType:     {concept: contact-type, source: Contact.contactType, type: string, allowed_scheme: role-contact-types, allowed: [Agent, HeadOfficer, Officer, Shareholder, SiteManager, Lessee]}
      title:           {concept: contact-title, source: Contact.title, type: string, null_policy: "absent when blank; as recorded"}
      corporationName: {concept: corporation-name, source: Contact.corporationName, type: string, null_policy: "absent when blank"}
      personName:      {concept: person-name, source: Contact.personName, type: string, null_policy: "absent when blank; never repeated outside the answer"}
    note: "Owner contacts come from Q2.2. A managing agent is a management relationship, not ownership. Roles are reported separately; one party can hold two."
  Q4.2:
    lookup: tests/q4_2/lookup.cypher
    fields:
      mailingAddress: {concept: mailing-address, source: Contact.mailingAddress, type: string, null_policy: "absent when none is recorded or duplicates disagree; always absent for site managers"}
      addressLine2:   {concept: address-line-two, source: Contact.addressLine2, type: string, null_policy: "absent when blank"}
      zip:            {concept: zip-code, source: Contact.zip, type: string, null_policy: "absent when blank"}
    note: "A shared address between roles is a record link, not evidence of identity or common ownership."

diagnostics: []

not_stored:   # deliberately absent from the graph
  - {term: hpd_contacts.contactdescription, reason: kind of entity (CORP, INDIV, CO-OP, GEN.PART); not needed for Q4}
  - {term: whether a contact is current, reason: contacts have no date of their own; the registration dates are Q2.1}
  - {term: business city and state, reason: not needed for Q4}
  - {term: hpd_contacts.registrationcontactid, reason: not unique in the snapshot}
