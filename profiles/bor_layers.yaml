  - {name: group_members.layer, physical_type: text, allowed: [owner_portfolio, operational_network], sentinels: none, used_by: [Q9.3], notes: "Q9 reads owner_portfolio rows only."}
  - {name: group_members.group_id, physical_type: text, allowed: "references groups", sentinels: none, used_by: [Q9.3], notes: ""}
  - {name: group_members.node_id, physical_type: integer, allowed: "references node_observations", sentinels: none, used_by: [Q9.3], notes: "Run-local landlord record id. Every lot of a portfolio node is in group_bbls of the same group."}
  - {name: masked_addresses.address_id, physical_type: text, allowed: "A<7 digits>", sentinels: none, used_by: [Q6.2], notes: "Run-local."}
  - {name: masked_addresses.method, physical_type: text, allowed: [network_address_edge_mask], sentinels: none, used_by: [Q6.2], notes: "One value for every row; recorded once in data/sources.yaml, not on the node."}
  - {name: masked_addresses.normalizer_version, physical_type: text, allowed: [c92693351768], sentinels: none, used_by: [Q6.2], notes: "One value for every row."}
  - {name: masked_addresses.degree, physical_type: integer, allowed: "26 to 216", sentinels: none, used_by: [Q6.2], notes: "Landlord records (nodes) at the address."}
  - {name: masked_addresses.degree_unit, physical_type: text, allowed: ["landlords (lwc nodes)"], sentinels: none, used_by: [Q6.2], notes: "One value for every row."}
  - {name: masked_addresses.threshold, physical_type: integer, allowed: [25], sentinels: none, used_by: [Q6.2], notes: "One value for every row; an address is masked above it."}
