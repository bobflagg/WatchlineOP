  - {name: identity_names.business_house, physical_type: text, allowed: "any text", sentinels: {blank: "no house number"}, used_by: [Q6.3], notes: ""}
  - {name: identity_names.business_street, physical_type: text, allowed: "any text", sentinels: {blank: "no street"}, used_by: [Q6.3], notes: "Uppercase, as filed."}
  - {name: identity_names.business_apartment, physical_type: text, allowed: "any text", sentinels: {blank: "no apartment or floor"}, used_by: [Q6.3], notes: "Floor and unit text (9FLOOR, 1204) is part of the address text, as in the network mask."}
  - {name: decision_events.subject_id, physical_type: text, allowed: "I<7 digits> for the identity mask events", sentinels: none, used_by: [Q6.3], notes: ""}
  - {name: decision_events.detail, physical_type: "text (JSON)", allowed: "an object with addr_degree, an integer", sentinels: none, used_by: [Q6.3], notes: "26 to 281; one value per derived address text. Differs from the network degree for 28 of the 30 texts both methods masked."}
  - {name: decision_events.layer, physical_type: text, allowed: [identity, operational_network], sentinels: none, used_by: [Q6.3], notes: "Only the rows named above are read."}
  - {name: decision_events.stage, physical_type: text, allowed: [identity.splink_base, network.address], sentinels: none, used_by: [Q6.3], notes: ""}
  - {name: decision_events.subject_type, physical_type: text, allowed: [identity, address], sentinels: none, used_by: [Q6.3], notes: "The Owner Portfolio mask has subject type identity."}
