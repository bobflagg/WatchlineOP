# Question schema: Q2 "Who is the HPD-registered owner of this building, and when was the registration last filed?"
# (sub-questions Q2.1 and Q2.2). Extends the Q1 graph; declares only what Q2 adds.
# Rules were proved in Stage 1; `proved_by` points at the expected-answer SQL that proves each one.
# Concept IDs are relative to concept_base. Source columns are documented in profiles/<source_key>.yaml.
question: Q2
concept_base: https://watchline.example/vocab/
database: watchline
sources: [hpd_registrations, hpd_contacts]

graph:
  constraints:
    - {name: registration_id_unique, label: Registration, property: registrationId, kind: unique}
    - {name: owner_contact_key_unique, label: OwnerContact, property: contactKey, kind: unique}

  nodes:
    Registration:
      concept: registration
      key: registrationId
      scope: One Registration per distinct registrationid greater than 0 on a hpd_registrations row with a valid BIN (192808 registrations). registrationid 0 is a placeholder and is excluded (3 pairs).
      proved_by: tests/q2_1/expected.sql
      properties:
        registrationId:
          concept: registration-id
          type: integer
          source: hpd_registrations.registrationid
          allowed: positive integer
          rule: "registrationid 0 is a placeholder shared by three unrelated buildings; rows with it are excluded and counted (3 pairs; 27 contacts, 6 of owner type), never turned into a registration."
          null_policy: never absent

    OwnerContact:
      concept: owner-contact
      key: contactKey
      scope: >-
        One OwnerContact per distinct (registrationid, type, name) of an owner-type contact on a loaded Registration
        (203802 contacts). Exact duplicates are one contact.
      proved_by: tests/q2_2/expected.sql
      properties:
        contactKey:
          concept: owner-contact
          type: string
          source: hpd_contacts.registrationid, hpd_contacts.type, hpd_contacts.corporationname
          rule: "Identity only, joined as registrationid|type|name. registrationcontactid is not unique in the snapshot and is not used. Not an answer field."
          identity_only: true
          null_policy: never absent
        contactType:
          concept: contact-type
          type: string
          source: hpd_contacts.type
          allowed_scheme: owner-contact-types
          allowed: [CorporateOwner, IndividualOwner, JointOwner]
          rule: Only the three owner types are loaded (decision 2026-11-12). The stored values are HPD's spellings.
          null_policy: never absent
          proved_by: tests/q2_2/expected.sql
        name:
          concept: owner-name
          type: string
          source: hpd_contacts.corporationname, hpd_contacts.firstname, hpd_contacts.middleinitial, hpd_contacts.lastname
          rule: >-
            CorporateOwner: corporationname. IndividualOwner and JointOwner: first name, middle initial and last name
            joined by single spaces, blank parts left out. As recorded, never normalized or merged.
          null_policy: "absent when the source name is blank (422 contacts: 183 corporate, 239 individual or joint)"
          proved_by: tests/q2_2/expected.sql

  relationships:
    HAS_REGISTRATION:
      concept: has-registration
      from: Building
      to: Registration
      source: hpd_registrations.bin, hpd_registrations.registrationid
      rule: >-
        One relationship per distinct (valid BIN, registrationid) pair (201763 pairs). Both endpoints must already exist;
        a missing Building is an error. The dates are those of the source rows of the pair.
      proved_by: tests/q2_1/expected.sql
      properties:
        lastRegistered:
          concept: last-registered-date
          type: date
          source: hpd_registrations.lastregistrationdate
          rule: "The pair's date when all its rows carry the same one; otherwise absent, never picked."
          null_policy: "absent when the source has no date or the rows of the pair disagree (3238 pairs); 198525 pairs have a value"
          proved_by: tests/q2_1/expected.sql
        registrationEnd:
          concept: registration-end-date
          type: date
          source: hpd_registrations.registrationenddate
          rule: "The pair's date when all its rows carry the same one; otherwise absent, never picked. The source has no period start date."
          null_policy: "absent when the rows of the pair disagree (8 pairs); 201755 pairs have a value"
          proved_by: tests/q2_1/expected.sql
    HAS_OWNER_CONTACT:
      concept: has-owner-contact
      from: Registration
      to: OwnerContact
      source: hpd_contacts.registrationid
      rule: One relationship per OwnerContact, from the registration it was recorded on. Contacts belong to the registration, not to one building.
      proved_by: tests/q2_2/expected.sql

answer:
  Q2.1:
    lookup: tests/q2_1/lookup.cypher
    fields:
      bin:             {concept: bin, source: Building.bin, type: string}
      registrations:   {concept: registration, source: "Building-[:HAS_REGISTRATION]->Registration", type: "list of {registrationId, lastRegistered, registrationEnd}", null_policy: "empty list means no HPD registration is recorded for the building, not that it has no owner"}
      registrationId:  {concept: registration-id, source: Registration.registrationId, type: integer}
      lastRegistered:  {concept: last-registered-date, source: HAS_REGISTRATION.lastRegistered, type: date, null_policy: "absent when HPD has no date or its rows disagree; never inferred"}
      registrationEnd: {concept: registration-end-date, source: HAS_REGISTRATION.registrationEnd, type: date, null_policy: "absent when its rows disagree; the agent states whether it is before or after the snapshot date (2026-05-29)"}
    note: "A building can have several registrations; all are returned and none is chosen. The source has no period start."
  Q2.2:
    lookup: tests/q2_2/lookup.cypher
    fields:
      registrationId: {concept: registration-id, source: Registration.registrationId, type: integer}
      owners:         {concept: owner-contact, source: "Registration-[:HAS_OWNER_CONTACT]->OwnerContact", type: "list of {contactType, name}", null_policy: "empty list means no owner contact is recorded; no owner is inferred"}
      contactType:    {concept: contact-type, source: OwnerContact.contactType, type: string, allowed_scheme: owner-contact-types, allowed: [CorporateOwner, IndividualOwner, JointOwner]}
      name:           {concept: owner-name, source: OwnerContact.name, type: string, null_policy: "absent when HPD's name is blank; reported exactly as recorded"}
    note: "All owner contacts of a registration are listed; none is chosen as the owner. Not proof of title; not the deed grantee, a process contact or the managing agent."

diagnostics: []

not_stored:   # deliberately absent from the graph
  - {term: registration period start, reason: not in the source; the answer says so}
  - {term: whether a registration is current, reason: the agent's reading of registrationEnd against a stated date}
  - {term: other contact types (Agent, HeadOfficer, Officer, Shareholder, SiteManager, Lessee), reason: different roles; belong to later questions}
  - {term: contact business address and title, reason: not needed for Q2}
  - {term: hpd_contacts.registrationcontactid, reason: not unique in the snapshot}
