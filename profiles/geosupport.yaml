# Application profile: Geosupport cached responses (source key `geosupport`; not in Postgres).
# PENDING: no cached response exists in the repository yet, so nothing below is inspected.
# Rules come from specs/questions/q01.md (Address resolution outcomes). Complete after the first
# recorded responses (GRC/reason codes for 7 AVENUE/SEVENTH AVENUE and 54 STREET/54TH STREET).
profile: geosupport
source_key: geosupport
snapshot: {snapshot_id: pending, snapshot_date: pending, note: "Geosupport release and Docker image pinned per test"}
columns:
  input_address:
    semantic_type: input street address as typed
    physical_type: text
    allowed: {pending: true}
    concept: street-address
    status: pending
    pending_reason: no cached response; function 1B input layout not yet recorded
    used_by: [Q1.1, Q1.3]
  grc:
    semantic_type: Geosupport return code
    physical_type: "string, 2 characters (per q01.md rules: 00, 01, EE, other reject codes)"
    allowed: {pending: true}
    concept: geosupport-return-code
    status: pending
    pending_reason: full reject-code list (Appendix 4) and recorded responses not available
    used_by: [Q1.3]
  reason_code:
    semantic_type: Geosupport reason code
    physical_type: string
    allowed: {pending: true}
    concept: geosupport-reason-code
    status: pending
    pending_reason: format and values not verified against a recorded response
    used_by: [Q1.3]
  returned_bbl:
    semantic_type: BBL from the 1A result set
    physical_type: string
    allowed: {pattern: '^[1-5][0-9]{9}$', note: "pattern assumed from the BBL concept; confirm on first response"}
    concept: bbl
    status: pending
    pending_reason: no cached response
    used_by: [Q1.1]
  returned_address:
    semantic_type: house number and street name returned
    physical_type: string
    allowed: {pending: true}
    concept: street-address
    status: pending
    pending_reason: no cached response
    used_by: [Q1.3]
  street_name_list:
    semantic_type: '"List of Street Names" candidates for GRC EE'
    physical_type: list of string
    allowed: {pending: true}
    concept: address-candidate
    status: pending
    pending_reason: no cached response
    used_by: [Q1.3]
