# Question schema: Q3 "Who is the grantee on the most recent ACRIS deed for this lot, and does the deed name the same party
# as the HPD registration, compared by exact normalized name?" (sub-questions Q3.1 to Q3.5).
# Extends the Q1 and Q2 graph; declares only what Q3 adds. Comparison results are computed at answer time (src/watchline/compare.py).
question: Q3
concept_base: https://watchline.example/vocab/
database: watchline
sources: [acris_master, acris_parties, acris_legals, hpd_contacts]

graph:
  constraints:
    - {name: deed_document_id_unique, label: Deed, property: documentId, kind: unique}
    - {name: grantee_key_unique, label: Grantee, property: partyKey, kind: unique}

  nodes:
    Deed:
      concept: deed
      key: documentId
      scope: >-
        One Deed per ACRIS document whose current version (latest modifieddate, then goodthroughdate) has one of the eight deed types
        and that is recorded against a Lot in the graph (1003931 deeds, queried 2026-11-12).
      proved_by: tests/q3_1/expected.sql
      properties:
        documentId:
          concept: document-id
          type: string
          source: acris_master.documentid
          null_policy: never absent
        docType:
          concept: document-type
          type: string
          source: acris_master.doctype
          allowed: [DEED, "DEED, TS", "DEED, LE", "DEED, RC", DEEDO, DEEDP, CORRD, CONDEED]
          rule: Stored as ACRIS spells it, from the current version. DEED COR is excluded (decision 2026-11-12).
          null_policy: never absent
        docDate:
          concept: document-date
          type: date
          source: acris_master.docdate
          rule: As recorded. Not used to choose the newest deed.
          null_policy: "absent when ACRIS has none (56929 of 1003931 deeds)"
        recordedDate:
          concept: recorded-date
          type: date
          source: acris_master.recordedfiled
          rule: The rule for "most recent".
          null_policy: never absent
        amount:
          concept: document-amount
          type: integer
          source: acris_master.docamount
          units: whole US dollars
          rule: As recorded. 0 is common and is never read as a free sale.
          null_policy: never absent

    Grantee:
      concept: grantee
      key: partyKey
      scope: >-
        One Grantee per distinct party row of partytype 2 on a loaded Deed (same document, name, street line, second line and ZIP are one).
        Grantors are not loaded (1520638 grantees, queried 2026-11-12).
      proved_by: tests/q3_2/expected.sql
      properties:
        partyKey:
          concept: grantee
          type: string
          source: acris_parties.documentid, acris_parties.name, acris_parties.address1, acris_parties.address2, acris_parties.zip
          rule: "Identity only, joined as documentid|name|address1|address2|zip with blanks empty. Not an answer field."
          identity_only: true
          null_policy: never absent
        name:
          concept: grantee-name
          type: string
          source: acris_parties.name
          rule: Trimmed, otherwise as recorded (double spaces kept). Never normalized in the graph.
          null_policy: "absent when blank (182 grantee rows)"
          proved_by: tests/q3_2/expected.sql
        mailingAddress:
          concept: mailing-address
          type: string
          source: acris_parties.address1
          rule: Trimmed, as recorded. Can hold a care-of line or a person's name.
          null_policy: "absent when blank"
          proved_by: tests/q3_2/expected.sql
        addressLine2:
          concept: address-line-two
          type: string
          source: acris_parties.address2
          rule: Trimmed, as recorded. Reported apart, never compared.
          null_policy: "absent when blank"
          proved_by: tests/q3_2/expected.sql
        zip:
          concept: zip-code
          type: string
          source: acris_parties.zip
          rule: Trimmed, as recorded (5 digits, 9 digits or non-US text).
          null_policy: "absent when blank"
          proved_by: tests/q3_2/expected.sql

    OwnerContact:   # properties Q3 adds to the Q2 node
      concept: owner-contact
      key: contactKey
      scope: Same nodes as Q2; Q3.5 adds the contact's mailing address.
      proved_by: tests/q3_5/expected.sql
      properties:
        mailingAddress:
          concept: mailing-address
          type: string
          source: hpd_contacts.businesshousenumber, hpd_contacts.businessstreetname
          rule: House number and street name joined by one space, blank parts left out. Absent when exact duplicate contacts disagree.
          null_policy: "absent when blank or when duplicates disagree"
          proved_by: tests/q3_5/expected.sql
        addressLine2:
          concept: address-line-two
          type: string
          source: hpd_contacts.businessapartment
          rule: Trimmed, as recorded. Reported apart. Absent when exact duplicates disagree.
          null_policy: "absent when blank (132048 of 214049 contact rows) or when duplicates disagree"
          proved_by: tests/q3_5/expected.sql
        zip:
          concept: zip-code
          type: string
          source: hpd_contacts.businesszip
          rule: Trimmed, as recorded. Absent when exact duplicates disagree.
          null_policy: "absent when blank (994 contact rows) or when duplicates disagree"
          proved_by: tests/q3_5/expected.sql

  relationships:
    HAS_DEED:
      concept: has-deed
      from: Lot
      to: Deed
      source: acris_legals.bbl, acris_legals.documentid
      rule: One per distinct (BBL, documentid) for a loaded Lot and Deed (1080721 pairs). A deed can sit on several lots.
      proved_by: tests/q3_1/expected.sql
    HAS_GRANTEE:
      concept: has-grantee
      from: Deed
      to: Grantee
      source: acris_parties.documentid
      rule: One per Grantee, from the deed it was recorded on.
      proved_by: tests/q3_2/expected.sql

answer:
  Q3.1:
    lookup: tests/q3_1/lookup.cypher
    fields:
      bbl:          {concept: bbl, source: Lot.bbl, type: string}
      deeds:        {concept: deed, source: "Lot-[:HAS_DEED]->Deed", type: "list of deed records, newest recorded date first", null_policy: "empty list means no deed in the snapshot, not that the lot never changed hands. All deeds tying on the latest recordedDate are returned, none chosen"}
      documentId:   {concept: document-id, source: Deed.documentId, type: string}
      docType:      {concept: document-type, source: Deed.docType, type: string}
      docDate:      {concept: document-date, source: Deed.docDate, type: date, null_policy: "absent when ACRIS has none"}
      recordedDate: {concept: recorded-date, source: Deed.recordedDate, type: date}
      amount:       {concept: document-amount, source: Deed.amount, type: integer, null_policy: "0 reported as recorded, never as a free sale"}
      otherLots:    {concept: has-deed, source: "count of other Lots on HAS_DEED to the same Deed", type: integer, counting_unit: "other graph lots (not parcels outside the graph)", null_policy: "0 when the deed names no other graph lot"}
    note: "Most recent means latest recorded date, not document date."
  Q3.2:
    lookup: tests/q3_2/lookup.cypher
    fields:
      grantees:       {concept: grantee, source: "Deed-[:HAS_GRANTEE]->Grantee", type: "list of {name, mailingAddress, addressLine2, zip}", null_policy: "empty list means no grantee is recorded (38 deeds); all grantees are listed"}
      name:           {concept: grantee-name, source: Grantee.name, type: string, null_policy: "absent when blank"}
      mailingAddress: {concept: mailing-address, source: Grantee.mailingAddress, type: string, null_policy: "absent when blank"}
      addressLine2:   {concept: address-line-two, source: Grantee.addressLine2, type: string, null_policy: "absent when blank"}
      zip:            {concept: zip-code, source: Grantee.zip, type: string, null_policy: "absent when blank"}
  Q3.3:
    lookup: tests/q3_3/lookup.cypher
    fields:
      owners: {concept: owner-contact, source: "Lot-[:HAS_BUILDING]->Building-[:HAS_REGISTRATION]->Registration-[:HAS_OWNER_CONTACT]->OwnerContact", type: "list of {registrationId, name, mailingAddress, addressLine2, zip}", null_policy: "empty list means no owner contact is recorded; none is chosen"}
    note: "Answered by Q2.2 through the lot's buildings; no new graph element."
  Q3.4:
    lookup: tests/q3_4/lookup.cypher
    fields:
      nameAgreement: {concept: name-agreement, source: "derived: src/watchline/compare.py name_agreement(Grantee.name, OwnerContact.name)", type: "list of {grantee, owner, outcome, rule}", allowed_scheme: name-agreement-outcomes, allowed: [exact-normalized, normalization-match, different, not-comparable], counting_unit: "one entry per grantee and owner pair", null_policy: "rule is N1 or N2 for a match, absent otherwise. Not a finding of the same party"}
      rule:          {concept: comparison-rule, source: "derived: compare.py", type: string, allowed: [N1, N2, A1]}
  Q3.5:
    lookup: tests/q3_5/lookup.cypher
    fields:
      addressAgreement: {concept: address-agreement, source: "derived: compare.py address_agreement(mailingAddress, zip) per grantee and owner pair", type: "list of {grantee, owner, outcome, rule, units}", allowed_scheme: address-agreement-outcomes, allowed: [same, differs, address-absent], counting_unit: "one entry per grantee and owner pair", null_policy: "outcome absent when either street line or ZIP is missing; units (second lines) reported apart. Same address at a mail drop is not evidence"}
    note: "The code's outcome 'absent' maps to the concept address-absent."

diagnostics: []

not_stored:   # deliberately absent from the graph
  - {term: name agreement, reason: computed at answer time over stored values (Q3.4)}
  - {term: address agreement, reason: computed at answer time (Q3.5)}
  - {term: comparison rule, reason: tool output (src/watchline/compare.py)}
  - {term: snapshots (answer field), reason: dataset-level provenance in data/sources.yaml (ACRIS 2026-05-31, HPD 2026-05-29); no per-record evidence fields yet}
  - {term: grantors (partytype 1), reason: out of scope; decision 2026-11-12}
  - {term: other party types and document types, reason: not needed until a later question}
  - {term: crfn, reel and page, pcttransferred, reason: not needed for Q3}
  - {term: mail-drop flag, reason: no curated list exists (open point)}
