[project]
name = "watchlineop"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "neo4j>=6.4.1",
    "psycopg[binary]>=3.3.8",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rdflib>=7.6.0",
    "shacl2cypher>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/watchline"]
