# Q1: every rule in "Rules for Stage 6 shapes" (ontology/ontology-notes.md) and how it is enforced.
# covered_by: compiled (shacl2cypher rule names, run on the graph), native (Neo4j constraint),
# test (a named sub-question check). scripts/check_shapes.py fails if a compiled rule is not listed
# here or if a listed name does not exist.
questions: [Q1, Q2, Q3]
rules:
  - id: R1
    rule: "bbl is 10 digits, first digit 1 to 5; bin is 7 digits, first digit 1 to 5, not ending 000000"
    covered_by: compiled
    names: [LotShape.bbl.datatype, LotShape.bbl.pattern, BuildingShape.bin.datatype, BuildingShape.bin.pattern, BuildingShape.bin.not]
  - id: R2
    rule: "bbl on every lot, bin on every building, hpdRegistered on every lot"
    covered_by: compiled
    names: [LotShape.bbl.minCount, BuildingShape.bin.minCount, LotShape.hpdRegistered.datatype, LotShape.hpdRegistered.minCount]
  - id: R3
    rule: "Every building is linked to at least one lot; HAS_BUILDING ends on a building"
    covered_by: compiled
    names: [BuildingShape.inv_hasBuilding.minCount, LotShape.hasBuilding.class]
  - id: R4
    rule: "Value rules: yearBuilt is never 0; units, assessed value and building count are whole numbers of 0 or more (0 means PLUTO records none); building class is never blank"
    covered_by: compiled
    names: [LotShape.yearBuilt.datatype, LotShape.yearBuilt.minInclusive, LotShape.residentialUnits.datatype, LotShape.residentialUnits.minInclusive, LotShape.assessedTotalValue.datatype, LotShape.assessedTotalValue.minInclusive, LotShape.plutoBuildingCount.datatype, LotShape.plutoBuildingCount.minInclusive, LotShape.buildingClass.datatype, LotShape.buildingClass.minLength]
  - id: R5
    rule: "plutoBuildingCount and the number of HAS_BUILDING objects are different counts, always reported separately"
    covered_by: test
    names: [tests/q1_2/check_buildings.py]
    note: "An answer rule, not a graph-state rule: the graph stores only PLUTO's count, and the two are compared in the answer."
  - id: N1
    rule: "One Lot per BBL, one Building per BIN"
    covered_by: native
    names: [lot_bbl_unique, building_bin_unique]
  # --- Q2 (ontology/ontology-notes.md, Q2 "Rules for Stage 6 shapes") ---
  - id: Q2-R1
    question: Q2
    rule: "registrationId is a positive integer and present on every registration"
    covered_by: compiled
    names: [RegistrationShape.registrationId.datatype, RegistrationShape.registrationId.minCount, RegistrationShape.registrationId.minInclusive]
  - id: Q2-R2
    question: Q2
    rule: "contactType is present on every contact and one of the nine HPD types (CorporateOwner, IndividualOwner, JointOwner, Agent, HeadOfficer, Officer, Shareholder, SiteManager, Lessee)"
    covered_by: compiled
    names: [ContactShape.contactType.datatype, ContactShape.contactType.minCount, ContactShape.contactType.pattern]
  - id: Q2-R3
    question: Q2
    rule: "Every registration is linked to at least one building; every contact to exactly one registration; the relationships end on the right class"
    covered_by: compiled
    names: [RegistrationShape.inv_hasRegistration.minCount, ContactShape.inv_hasContact.minCount, ContactShape.inv_hasContact.maxCount, BuildingRegistrationShape.hasRegistration.class, RegistrationShape.hasContact.class]
  - id: Q2-R4
    question: Q2
    rule: "At most one lastRegistered and one registrationEnd per building and registration pair (one HAS_REGISTRATION per pair)"
    covered_by: check
    names: [queries/checks/q02-duplicate-pair.cypher]
    note: "Relationship properties are outside what shacl2cypher compiles; a named Cypher check covers it."
  - id: Q2-R5
    question: Q2
    rule: "registrationEnd is never before lastRegistered"
    covered_by: check
    names: [queries/checks/q02-end-before-last.cypher]
  - id: Q2-R6
    question: Q2
    rule: "A contact with no corporation name or person name has it absent, never an empty string"
    covered_by: compiled
    names: [ContactShape.corporationName.datatype, ContactShape.corporationName.minLength, ContactShape.personName.datatype, ContactShape.personName.minLength]
  - id: Q2-R7
    question: Q2
    rule: "Names are reported as recorded; no rule merges or compares spellings"
    covered_by: test
    names: [tests/q2_2/check_owners.py]
    note: "An answer rule: the fixtures hold the three spellings of one owner and compare them as recorded."
  - id: Q2-N1
    question: Q2
    rule: "One Registration per registrationId, one Contact per contactKey"
    covered_by: native
    names: [registration_id_unique, contact_key_unique]
  # --- Q3 (ontology/ontology-notes.md, Q3 "Rules for Stage 6 shapes") ---
  - id: Q3-R1
    question: Q3
    rule: "documentId, documentType and recordedDate present on every deed; documentType is one of the eight deed codes; dates are dates"
    covered_by: compiled
    names: [DeedShape.documentId.minCount, DeedShape.documentId.datatype, DeedShape.documentId.minLength, DeedShape.documentType.minCount, DeedShape.documentType.datatype, DeedShape.documentType.pattern, DeedShape.recordedDate.minCount, DeedShape.recordedDate.datatype, DeedShape.documentDate.datatype]
  - id: Q3-R2
    question: Q3
    rule: "documentAmount is a whole number, never negative; 0 is kept as recorded"
    covered_by: compiled
    names: [DeedShape.documentAmount.datatype, DeedShape.documentAmount.minInclusive]
  - id: Q3-R3
    question: Q3
    rule: "Every deed is linked to at least one lot; every grantee to exactly one deed; the relationships end on the right class"
    covered_by: compiled
    names: [DeedShape.inv_hasDeed.minCount, GranteeShape.inv_hasGrantee.minCount, GranteeShape.inv_hasGrantee.maxCount, LotDeedShape.hasDeed.class, DeedShape.hasGrantee.class]
  - id: Q3-R4
    question: Q3
    rule: "A blank grantee name or address part is absent, never an empty string (also for owner contact address parts)"
    covered_by: compiled
    names: [GranteeShape.granteeName.datatype, GranteeShape.granteeName.minLength, GranteeShape.mailingAddress.datatype, GranteeShape.mailingAddress.minLength, GranteeShape.addressLineTwo.datatype, GranteeShape.addressLineTwo.minLength, GranteeShape.zipCode.datatype, GranteeShape.zipCode.minLength, ContactAddressShape.mailingAddress.datatype, ContactAddressShape.mailingAddress.minLength, ContactAddressShape.addressLineTwo.datatype, ContactAddressShape.addressLineTwo.minLength, ContactAddressShape.zipCode.datatype, ContactAddressShape.zipCode.minLength]
  - id: Q3-R5
    question: Q3
    rule: "At most one HAS_DEED per lot and deed pair"
    covered_by: check
    names: [queries/checks/q03-duplicate-deed-pair.cypher]
  - id: Q3-R6
    question: Q3
    rule: "Names are stored as recorded (trimmed only); no normalization in the graph. Most recent = latest recordedDate, ties all returned"
    covered_by: test
    names: [tests/q3_1/check_deeds.py, tests/q3_4/check_names.py]
    note: "Answer rules: the fixtures hold the tied-deed case and anchor G (a spacing difference stays a difference)."
  - id: Q3-N1
    question: Q3
    rule: "One Deed per documentId, one Grantee per partyKey. Single-valued properties (including dates) hold by the Neo4j property model"
    covered_by: native
    names: [deed_document_id_unique, grantee_key_unique]
  # --- Q4 (ontology/ontology-notes.md, Q4 "Rules for Stage 6 shapes") ---
  - id: Q4-R3
    question: Q4
    rule: "A blank title is absent, never an empty string (names and address parts: Q2-R6, Q3-R4)"
    covered_by: compiled
    names: [ContactTitleShape.contactTitle.datatype, ContactTitleShape.contactTitle.minLength]
  - id: Q4-R4
    question: Q4
    rule: "corporationName appears only on corporate owners, agents and lessees"
    covered_by: check
    names: [queries/checks/q04-corporation-name-types.cypher]
    note: "Conditional on another property; outside what shacl2cypher compiles."
  - id: Q4-R5
    question: Q4
    rule: "A site manager has no mailingAddress, addressLine2 or zip"
    covered_by: check
    names: [queries/checks/q04-site-manager-address.cypher]
  - id: Q4-R6
    question: Q4
    rule: "Titles and names are stored as recorded (trimmed only); a title never changes the type. An empty set of role contacts means none is recorded"
    covered_by: test
    names: [tests/q4_1/check_roles.py]
    note: "Answer rules: the fixtures hold anchor C (PRESIDENT OF CO stays HeadOfficer, agent is the owners corporation) and a building with no role contact."
  # --- Q5 (ontology/ontology-notes.md, Q5 "Rules for Stage 6 shapes") ---
  - id: Q5-R1
    question: Q5
    rule: "dosId is a positive integer and present; dosEntityName, entityType and initialFilingDate are present on every DOS entity"
    covered_by: compiled
    names: [DosEntityShape.dosId.minCount, DosEntityShape.dosId.datatype, DosEntityShape.dosId.minInclusive, DosEntityShape.dosEntityName.minCount, DosEntityShape.dosEntityName.datatype, DosEntityShape.dosEntityName.minLength, DosEntityShape.entityType.minCount, DosEntityShape.entityType.datatype, DosEntityShape.entityType.minLength, DosEntityShape.initialFilingDate.minCount, DosEntityShape.initialFilingDate.datatype]
  - id: Q5-R2
    question: Q5
    rule: "A blank jurisdiction, process part or agent part is absent, never an empty string"
    covered_by: compiled
    names: [DosEntityShape.jurisdiction.datatype, DosEntityShape.jurisdiction.minLength, DosEntityShape.processName.datatype, DosEntityShape.processName.minLength, DosEntityShape.processAddress.datatype, DosEntityShape.processAddress.minLength, DosEntityShape.processAddressLineTwo.datatype, DosEntityShape.processAddressLineTwo.minLength, DosEntityShape.processCity.datatype, DosEntityShape.processCity.minLength, DosEntityShape.processState.datatype, DosEntityShape.processState.minLength, DosEntityShape.processZip.datatype, DosEntityShape.processZip.minLength, DosEntityShape.registeredAgentName.datatype, DosEntityShape.registeredAgentName.minLength, DosEntityShape.registeredAgentAddress.datatype, DosEntityShape.registeredAgentAddress.minLength, DosEntityShape.registeredAgentAddressLineTwo.datatype, DosEntityShape.registeredAgentAddressLineTwo.minLength, DosEntityShape.registeredAgentCity.datatype, DosEntityShape.registeredAgentCity.minLength, DosEntityShape.registeredAgentState.datatype, DosEntityShape.registeredAgentState.minLength, DosEntityShape.registeredAgentZip.datatype, DosEntityShape.registeredAgentZip.minLength]
  - id: Q5-R3
    question: Q5
    rule: "initialFilingDate is not after the snapshot date (2026-07-06)"
    covered_by: check
    names: [queries/checks/q05-filing-date-not-future.cypher]
    note: "Date comparison against a constant; outside what shacl2cypher compiles."
  - id: Q5-R4
    question: Q5
    rule: "A DOS entity has no relationship to an owner contact, grantee, registration or anything else"
    covered_by: check
    names: [queries/checks/q05-no-relationships.cypher]
  - id: Q5-R5
    question: Q5
    rule: "nameKey is rule N3 of the name, and every DOS entity's key equals the N3 key of a CorporateOwner owner name or a grantee name (scope)"
    covered_by: check
    names: [queries/checks/q05-name-key-scope.cypher]
    note: "N3 is re-implemented in Cypher here; tests/q5_1 compares with compare.py."
  - id: Q5-R6
    question: Q5
    rule: "Statutory default process names are kept as recorded; address parts and agent state are stored as recorded (an agent state without an agent name is allowed); records sharing a key are all kept"
    covered_by: test
    names: [tests/q5_1/check_dos.py, tests/q5_2/check_process.py, tests/q5_3/check_agent.py]
    note: "Answer rules: the fixtures hold THE COMPANY, the person process name, anchor C/D/G spellings and the two-id name."
  - id: Q5-N1
    question: Q5
    rule: "One DosEntity per dosId"
    covered_by: native
    names: [dos_entity_id_unique]
  # --- Q8 (ontology/ontology-notes.md, Q8 "Rules for Stage 6 shapes") ---
  - id: Q8-R1
    question: Q8
    rule: "Every network has an id of the form ON-<n> and a split of wcc or louvain"
    covered_by: compiled
    names: [OperationalNetworkShape.groupId.minCount, OperationalNetworkShape.groupId.datatype, OperationalNetworkShape.groupId.pattern, OperationalNetworkShape.networkSplit.minCount, OperationalNetworkShape.networkSplit.datatype, OperationalNetworkShape.networkSplit.in]
  - id: Q8-R2
    question: Q8
    rule: "A lot is in at most one network, a network has at least two member lots"
    covered_by: compiled
    names: [LotNetworkShape.inNetwork.maxCount, LotNetworkShape.inNetwork.class, OperationalNetworkShape.inv_inNetwork.minCount]
  - id: Q8-R3
    question: Q8
    rule: "networkAbsence is one of the five top-level codes and networkAbsenceDetail one of the eleven detail codes"
    covered_by: compiled
    names: [LotNetworkShape.networkAbsence.datatype, LotNetworkShape.networkAbsence.in, LotNetworkShape.networkAbsenceDetail.datatype, LotNetworkShape.networkAbsenceDetail.in]
  - id: Q8-R4
    question: Q8
    rule: "Both absence properties are present or both absent, absent on a lot in a network, and each detail code belongs to its top-level reason"
    covered_by: check
    names: [queries/checks/q08-absence.cypher]
    note: "The hierarchy lives in the vocabulary, not the graph; the mapping from detail code to top-level reason is repeated in the Cypher check (BOR DATA.md levels)."
  - id: Q8-R5
    question: Q8
    rule: "What a landlord covers is a lot (that it covers one, or is the end of a portfolio link, is Q9-R6)"
    covered_by: compiled
    names: [LandlordShape.covers.class]
  - id: Q8-R6
    question: Q8
    rule: "Each COVERS has an integer registrationId; every lot in a network is covered by exactly one landlord; a landlord that covers a lot in a network covers lots of one network only, all of them in a network"
    covered_by: check
    names: [queries/checks/q08-covers.cypher]
    note: "tests/q8_3 also compares every cover and its registration with the release and the source."
  - id: Q8-R7
    question: Q8
    rule: "A name or address link joins two different landlords (lower id first) and has a networkEdgeId string and a weight above 0; an identity link the network used has weight 100; a network group id is present exactly when both ends are in one network; every network has a link inside it"
    covered_by: check
    names: [queries/checks/q08-links.cypher]
    note: "Relationship properties and cross-node comparisons are outside what shacl2cypher compiles. tests/q8_3 compares every link, with its ids and weights, with the release graph_edges field by field."
  - id: Q8-R8a
    question: Q8
    rule: "A landlord record has a name: a non-blank string"
    covered_by: compiled
    names: [LandlordShape.landlordName.datatype, LandlordShape.landlordName.minCount, LandlordShape.landlordName.minLength]
  - id: Q8-R8b
    question: Q8
    rule: "businessAddresses, when present, is a non-empty, sorted list of distinct non-blank strings; every operational network and every owner portfolio has exactly one anchor, a landlord"
    covered_by: check
    names: [queries/checks/q08-labels.cypher]
    note: "A list property and a relationship that starts at either of two labels are outside what shacl2cypher compiles. tests/q8_3 and tests/q9_1 compare names, addresses and anchors with the release."
  - id: Q8-R9
    question: Q8
    rule: "BASED_ON_CONTACT ends on a contact"
    covered_by: compiled
    names: [LandlordShape.basedOnContact.class]
    note: "That each link matches the release (registration, type and names of a selected observation) is tests/q8_3/check_contacts.py."
  - id: Q8-N1
    question: Q8
    rule: "One OperationalNetwork per groupId; one Landlord per nodeId"
    covered_by: native
    names: [operational_network_id_unique, landlord_id_unique]
  - id: Q9-R1
    question: Q9
    rule: "groupId is present, a string, OP- followed by an integer; composition is present and one of identity, deed_only, deed_bridged"
    covered_by: compiled
    names: [OwnerPortfolioShape.portfolioId.minCount, OwnerPortfolioShape.portfolioId.datatype, OwnerPortfolioShape.portfolioId.pattern, OwnerPortfolioShape.portfolioComposition.minCount, OwnerPortfolioShape.portfolioComposition.datatype, OwnerPortfolioShape.portfolioComposition.in]
  - id: Q9-R2
    question: Q9
    rule: "A portfolio has at least one member rental lot; a lot is in at most one portfolio, and that is a portfolio"
    covered_by: compiled
    names: [OwnerPortfolioShape.inv_inPortfolio.minCount, LotPortfolioShape.inPortfolio.maxCount, LotPortfolioShape.inPortfolio.class]
  - id: Q9-R3
    question: Q9
    rule: "portfolioAbsence is one of BOR's five top-level codes; portfolioAbsenceDetail one of the 18 detail codes used in this layer"
    covered_by: compiled
    names: [LotPortfolioShape.portfolioAbsence.datatype, LotPortfolioShape.portfolioAbsence.in, LotPortfolioShape.portfolioAbsenceDetail.datatype, LotPortfolioShape.portfolioAbsenceDetail.in]
  - id: Q9-R4
    question: Q9
    rule: "Both portfolio absence properties are present or both absent, absent on a lot in a portfolio, and each detail code belongs to its top-level reason"
    covered_by: check
    names: [queries/checks/q09-absence.cypher]
    note: "The hierarchy lives in the vocabulary, not the graph; the mapping from detail code to top-level reason is repeated in the Cypher check (BOR DATA.md levels). A co-op or condo lot outside the footprint (coop_condo_excluded) has no IN_PORTFOLIO, which this rule enforces."
  - id: Q9-R5
    question: Q9
    rule: "An identity or deed link used by a portfolio joins two different landlords (lower id first) and has a portfolioEdgeId, an evidenceId, a stage among the codes of its type and the matching evidenceType; a deed link carries no weight; its ends cover lots of one portfolio only, the same one as its portfolio group id"
    covered_by: check
    names: [queries/checks/q09-links.cypher]
    note: "Relationship properties and cross-node comparisons are outside what shacl2cypher compiles. tests/q9_3 compares every link with the release graph_edges."
  - id: Q9-R6
    question: Q9
    rule: "A landlord covers a lot or is the end of a portfolio link of a group; each lot in a portfolio is covered by at least one landlord; in a portfolio with more than one covering landlord each of them has a link"
    covered_by: check
    names: [queries/checks/q09-landlords.cypher]
    note: "Replaces the Q8 rule that every landlord covers a lot: 115 portfolio landlords cover only co-op or condo lots that are not in the graph."
  - id: Q9-N1
    question: Q9
    rule: "One OwnerPortfolio per groupId"
    covered_by: native
    names: [owner_portfolio_id_unique]
  - id: Q6-R1
    question: Q6
    rule: "A masked address has an id (A and seven digits), a non-blank text, an integer degree above the threshold of 25 and a non-negative integer count of set-aside edges"
    covered_by: compiled
    names: [NetworkMaskedAddressShape.maskedAddressDegree.datatype, NetworkMaskedAddressShape.maskedAddressDegree.minCount, NetworkMaskedAddressShape.maskedAddressDegree.minInclusive, NetworkMaskedAddressShape.maskedEdges.datatype, NetworkMaskedAddressShape.maskedEdges.minCount, NetworkMaskedAddressShape.maskedEdges.minInclusive, NetworkMaskedAddressShape.maskedAddressId.datatype, NetworkMaskedAddressShape.maskedAddressId.minCount, NetworkMaskedAddressShape.maskedAddressId.pattern, NetworkMaskedAddressShape.maskedAddressText.datatype, NetworkMaskedAddressShape.maskedAddressText.minCount, NetworkMaskedAddressShape.maskedAddressText.minLength]
  - id: Q6-R2
    question: Q6
    rule: "A listed address has a key text, a kind of the four codes, a basis and the review status unreviewed; its zip5 is five digits when present"
    covered_by: compiled
    names: [MailDropAddressShape.listReviewStatus.datatype, MailDropAddressShape.listReviewStatus.in, MailDropAddressShape.listReviewStatus.minCount, MailDropAddressShape.mailDropAddressKey.datatype, MailDropAddressShape.mailDropAddressKey.minCount, MailDropAddressShape.mailDropAddressKey.minLength, MailDropAddressShape.mailDropBasis.datatype, MailDropAddressShape.mailDropBasis.minCount, MailDropAddressShape.mailDropBasis.minLength, MailDropAddressShape.mailDropKind.datatype, MailDropAddressShape.mailDropKind.in, MailDropAddressShape.mailDropKind.minCount, MailDropAddressShape.zipFive.datatype, MailDropAddressShape.zipFive.pattern]
  - id: Q6-R5
    question: Q6
    rule: "A portfolio masked address has a non-blank derived text, an integer degree above the threshold of 25 and at least one masked identity"
    covered_by: compiled
    names: [PortfolioMaskedAddressShape.portfolioMaskedAddressText.datatype, PortfolioMaskedAddressShape.portfolioMaskedAddressText.minCount, PortfolioMaskedAddressShape.portfolioMaskedAddressText.minLength, PortfolioMaskedAddressShape.portfolioMaskedAddressDegree.datatype, PortfolioMaskedAddressShape.portfolioMaskedAddressDegree.minCount, PortfolioMaskedAddressShape.portfolioMaskedAddressDegree.minInclusive, PortfolioMaskedAddressShape.maskedIdentities.datatype, PortfolioMaskedAddressShape.maskedIdentities.minCount, PortfolioMaskedAddressShape.maskedIdentities.minInclusive]
  - id: Q6-R3
    question: Q6
    rule: "Masked address texts are unique within each method; no node has two of the labels NetworkMaskedAddress, PortfolioMaskedAddress, MailDropAddress; the list key is address|zip5; the identity counts of portfolio masked addresses sum to 5298"
    covered_by: check
    names: [queries/checks/q06-addresses.cypher]
    note: "tests/q6_2 and q6_4 compare every node with the release and the list."
  - id: Q6-R4
    question: Q6
    rule: "A masked address (either method) and a listed address have no relationship"
    covered_by: check
    names: [queries/checks/q06-no-relationships.cypher]
    note: "The match to HPD contact addresses is by text at answer time (user decision 2026-11-13)."
  - id: Q6-N1
    question: Q6
    rule: "One NetworkMaskedAddress per addressId; one PortfolioMaskedAddress per address text; one MailDropAddress per list key"
    covered_by: native
    names: [network_masked_address_id_unique, portfolio_masked_address_unique, mail_drop_address_key_unique]
  # --- Q7 (ontology/ontology-notes.md, Q7 "Rules for Stage 6 shapes") ---
  - id: Q7-R1
    question: Q7
    rule: "documentId and documentType present on every document; dates are dates; documentAmount is a whole number, never negative"
