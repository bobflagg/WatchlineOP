  # --- Q11 (ontology/ontology-notes.md, Q11 "Rules for Stage 6 shapes"; no new graph element, so no new SHACL shape) ---
  - id: Q11-R1
    question: Q11
    rule: "A mortgage (docType MTGE) has only parties with partyType 1 (borrower) or 2 (lender); every mortgage names at least one HPD CorporateOwner name (N3, scope M); no node or relationship stores an affiliation type or an evidence status"
    covered_by: check
    names: [queries/checks/q11-mortgages.cypher]
    note: "Conditional rules and link properties are outside what shacl2cypher compiles. Document, DocumentParty and HAS_PARTY keep their Q7 shapes and native constraints."
  - id: Q11-R2
    question: Q11
